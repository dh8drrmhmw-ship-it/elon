name: 检查能力值抓取

on:
  pull_request:
    paths:
      - scripts/fetch-ratings.mjs
      - scripts/probe-savant.mjs
      - .github/workflows/ratings-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 探测 Baseball Savant
        run: node scripts/probe-savant.mjs
      - name: 抓取 MLB The Show 能力值
        run: node scripts/fetch-ratings.mjs ratings.json
      - name: 查看结果
        run: ls -l ratings.json && head -c 600 ratings.json
