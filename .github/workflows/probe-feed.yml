name: 临时探测首页数据
on:
  pull_request:
    paths: [scripts/probe-feed.mjs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-feed.mjs
