name: 临时列出缺少译名的球员
on:
  pull_request:
    paths: [scripts/dump-roster-names.mjs]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/dump-roster-names.mjs
