<title>本垒棒球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: phone-width app column — deep navy masthead with channel tabs, cool-white card feed, fixed bottom tab bar, full-screen sheets for game / team / article detail */
:root{
  --mast:#0a1d3f; --mast-2:#06142e; --on-mast:#ffffff; --on-mast-dim:rgba(225,233,247,.68); --mast-glass:rgba(255,255,255,.1);
  --brand:#1f5fd1; --brand-ink:#1849a8; --brand-soft:#e7eefb; --red:#c8102e; --red-soft:#fbe9ec; --gold:#b8862b;
  --bg:#f1f3f7; --card:#ffffff; --fg:#0c1628; --muted:#5d6a80; --faint:#97a1b3; --line:#e4e8ef; --soft:#f5f7fa;
  --on-team:#ffffff; --shadow:0 1px 2px rgba(10,29,63,.05);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mast:#08152d; --mast-2:#040b1a; --on-mast:#ffffff; --on-mast-dim:rgba(210,220,240,.62); --mast-glass:rgba(255,255,255,.08);
    --brand:#7aa5ff; --brand-ink:#93b6ff; --brand-soft:#15254a; --red:#ff5468; --red-soft:#3a1720; --gold:#e0b25a;
    --bg:#060b15; --card:#0e1626; --fg:#e8edf6; --muted:#8b97ad; --faint:#5b677d; --line:#1b2639; --soft:#131d30;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mast:#08152d; --mast-2:#040b1a; --on-mast:#ffffff; --on-mast-dim:rgba(210,220,240,.62); --mast-glass:rgba(255,255,255,.08);
  --brand:#7aa5ff; --brand-ink:#93b6ff; --brand-soft:#15254a; --red:#ff5468; --red-soft:#3a1720; --gold:#e0b25a;
  --bg:#060b15; --card:#0e1626; --fg:#e8edf6; --muted:#8b97ad; --faint:#5b677d; --line:#1b2639; --soft:#131d30;
  --shadow:none; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mast)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;color:var(--on-mast);background:linear-gradient(180deg,var(--mast),var(--mast-2));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.mast-top{display:flex;align-items:center;gap:12px;min-height:36px}
.brand{display:flex;align-items:center;gap:7px;font:900 21px/1 var(--f-display);letter-spacing:.06em;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--on-mast)}
.mast h1{margin:0;font:700 19px var(--f-display);letter-spacing:.06em;flex:1}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
  background:var(--mast-glass);color:var(--on-mast-dim);font-size:13px;white-space:nowrap;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.search svg{width:15px;height:15px;flex:none}
.src{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:10px;background:var(--mast-glass);color:var(--on-mast-dim);white-space:nowrap}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.src.ok{color:var(--on-mast)}
.src.ok::before{background:#3ddc84}
.src.off::before{background:#f2b84b}
.channels{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.channels::-webkit-scrollbar{display:none}
.channels button{position:relative;padding:8px 0 11px;font-size:15px;color:var(--on-mast-dim);white-space:nowrap}
.channels button[aria-selected="true"]{color:var(--on-mast);font-weight:700;font-size:16px}
.channels button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:4px;width:16px;height:2px;background:var(--red);transform:translateX(-50%)}
.mast-pad{height:12px}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;display:grid;gap:12px}
.panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 5px;font-weight:700;font-size:15px}
.sec-h small{font-weight:400;font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}

/* live strip */
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 14px}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;padding:10px;border-radius:10px;background:var(--soft);display:grid;gap:6px}
.mini-meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted)}
.mini-row{display:flex;align-items:center;gap:6px;font-size:13px}
.mini-row b{margin-left:auto;font:600 19px var(--f-num);font-variant-numeric:tabular-nums}
.lose{color:var(--muted)}

/* logos & art */
.logo{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tc);color:var(--on-team);
  font:700 9.5px/1 var(--f-num);letter-spacing:.02em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.logo.cn{font:600 9.5px/1 var(--f-body)}
.logo.md{width:34px;height:34px;font-size:12px}
.logo.lg{width:54px;height:54px;font-size:17px}
.logo.xl{width:72px;height:72px;font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.25)}
.art{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--on-team);
  background:linear-gradient(115deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18))}
.art.solo{background:radial-gradient(120% 140% at 85% 0%,#1d4b9a 0%,var(--mast) 55%,var(--mast-2) 100%)}
.art .seam{position:absolute;right:-16%;top:-34%;width:88%;aspect-ratio:1;opacity:.12;color:var(--on-team)}
.art i{font:italic 700 18px var(--f-num);position:relative;z-index:1;opacity:.85}
.art .label{position:relative;z-index:1;font:900 22px var(--f-display);letter-spacing:.12em}
.art .logo{position:relative;z-index:1}

/* hero + news */
.hero{display:block;width:100%}
.hero .art{aspect-ratio:16/8;max-width:100%}
.hero .art .logo{width:66px;height:66px;font-size:20px}
.hero-t{padding:13px 14px 14px;font-size:18px;font-weight:700;line-height:1.45;text-wrap:balance}
.hero-t .news-m{margin-top:8px;font-weight:400}
.news{display:flex;gap:12px;width:100%;padding:13px 14px;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news-tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.news-t{font-size:16px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.news .art{flex:none;width:112px;height:74px;border-radius:8px}
.news .art .logo{width:26px;height:26px;font-size:9px}
.news .art i{font-size:12px}
.news .art .label{font-size:15px}
.tag{font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;color:var(--brand-ink);background:var(--brand-soft)}
.tag.hot{color:var(--red);background:var(--red-soft)}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.notice b{color:var(--fg);font-weight:500}

/* games */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:8px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:4px 12px;border-radius:14px;font-size:13px;background:var(--mast-glass);color:var(--on-mast-dim)}
.chip[aria-pressed="true"]{background:var(--on-mast);color:var(--mast);font-weight:700}
.dates{display:flex;justify-content:space-between;gap:4px;padding-block:8px 10px}
.dates button{flex:1;min-width:0;display:grid;justify-items:center;padding:4px 0;border-radius:8px;color:var(--on-mast-dim);font-size:11px}
.dates button b{font:600 17px var(--f-num)}
.dates button[aria-pressed="true"]{background:var(--mast-glass);color:var(--on-mast);box-shadow:inset 0 -2px 0 var(--red)}
.lg-h{font-size:13px;color:var(--muted);padding-inline:2px;display:flex;justify-content:space-between}
.game{display:grid;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.g-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.g-row{display:flex;align-items:center;gap:10px;font-size:15px}
.g-row>span:not(.logo){flex:1;min-width:0}
.g-row span small{color:var(--faint);font-size:12px}
.g-row b{font:600 25px/1 var(--f-num);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.g-row em{font-style:normal;font-size:12px;color:var(--faint);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;font-weight:500;white-space:nowrap}
.st.live{color:var(--red);display:inline-flex;align-items:center;gap:5px}
.st.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
.st.final{color:var(--muted)}
.st.pre{color:var(--brand-ink)}
@keyframes pulse{50%{opacity:.25}}

/* stats */
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;margin:12px 14px 4px}
.seg button{flex:1;text-align:center;padding:6px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(10,29,63,.1)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:right;padding:8px 6px}
td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td.tm{font-family:var(--f-body);font-size:14px}
td.tm button,td.tm span.t{display:inline-flex;align-items:center;gap:8px}
.rk{display:inline-block;width:16px;color:var(--faint);font-family:var(--f-num);font-style:normal}
.rk.top{color:var(--brand-ink);font-weight:700}
.leader{padding:4px 0 8px}
.leader h3{margin:0;padding:10px 14px 4px;font-size:14px;display:flex;justify-content:space-between}
.leader h3 small{font-weight:400;color:var(--faint);font-size:12px;letter-spacing:.08em}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:14px;width:100%}
.lrow>span:not(.logo){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow b{font:600 18px var(--f-num);font-variant-numeric:tabular-nums}
.leader .lrow:first-of-type b{color:var(--brand-ink)}
.note{font-size:12px;color:var(--faint);padding:8px 14px 12px;line-height:1.6}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:6px 14px 14px}
.tcell{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:var(--soft);font-size:14px;min-width:0}
.tcell span{display:grid;min-width:0}
.tcell small{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* circle */
.circles{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 14px}
.circles::-webkit-scrollbar{display:none}
.circle{flex:none;display:grid;justify-items:center;gap:4px;width:62px;font-size:12px}
.circle small{color:var(--faint);font-size:11px}
.post{padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.post:first-child{border-top:0}
.post-h{display:flex;align-items:center;gap:10px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--on-team);background:var(--tc)}
.post-h div{flex:1;min-width:0;display:grid}
.post-h b{font-size:14px;font-weight:500}
.post-h small{font-size:12px;color:var(--faint)}
.post p{margin:0;font-size:15px}
.post-f{display:flex;gap:22px;font-size:13px;color:var(--muted)}
.post-f button,.post-f span{display:inline-flex;align-items:center;gap:4px}
.post-f svg{width:16px;height:16px}
.post-f [aria-pressed="true"]{color:var(--red)}
.post-f [aria-pressed="true"] svg path{fill:currentColor}
.ctag{font-size:12px;color:var(--brand-ink)}

/* me */
.profile{display:flex;align-items:center;gap:14px;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,var(--mast-2),var(--mast));color:var(--on-mast)}
.profile .avatar{width:56px;height:56px;font-size:22px;background:var(--mast-glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.profile div{display:grid;gap:2px}
.profile b{font:700 18px var(--f-display);letter-spacing:.04em}
.profile small{color:var(--on-mast-dim);font-size:13px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 0}
.counts div{display:grid;justify-items:center;font-size:12px;color:var(--muted)}
.counts b{font:600 21px var(--f-num);color:var(--fg)}
.follow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:8px 14px 14px}
.fbtn{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;background:var(--soft);font-size:13px;border:1px solid transparent;min-width:0}
.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.menu-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-top:1px solid var(--line);font-size:15px;gap:12px}
.menu-row:first-child{border-top:0}
.menu-row small{color:var(--muted);font-size:13px;text-align:right}
.seg.inline{margin:0;padding:2px}
.seg.inline button{padding:3px 10px;font-size:12px}

/* bottom nav */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:15;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:1px;padding:7px 0 6px;font-size:11px;color:var(--faint)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--brand-ink);font-weight:500}

/* sheets */
.sheet{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translate(-50%,24px);opacity:.4}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:48px;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h.dark{background:var(--mast);color:var(--on-mast);border-bottom:0}
.sheet-h.team{background:var(--tc);color:var(--on-team);border-bottom:0}
.sheet-h b{flex:1;min-width:0;font-size:16px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .side{width:40px;flex:none}
.back{width:40px;height:40px;display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.sheet-h .search-in{flex:1;min-width:0;height:34px;border-radius:17px;border:0;padding:0 14px;background:var(--soft);color:var(--fg);font:inherit;font-size:14px}

.article{background:var(--card);padding:18px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.article h2{margin:0 0 10px;font:700 22px/1.45 var(--f-display);text-wrap:balance}
.article .news-m{margin-bottom:16px}
.article .art{aspect-ratio:16/8;max-width:100%;border-radius:10px;margin-bottom:16px}
.article .art .logo{width:60px;height:60px;font-size:18px}
.article p{margin:0 0 14px;font-size:16px;line-height:1.85;max-width:65ch}
.article .formula{font-family:var(--f-num);font-size:17px;background:var(--soft);border-left:3px solid var(--brand);border-radius:0 6px 6px 0;padding:10px 12px}
.cmts{background:var(--card);margin-top:10px;padding-bottom:80px}
.cmt{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.cmt .avatar{width:30px;height:30px;font-size:13px}
.cmt div{flex:1;min-width:0;display:grid;gap:2px}
.cmt b{font-size:13px;font-weight:500;color:var(--muted)}
.cmt p{margin:0;font-size:15px}
.cmt small{font-size:12px;color:var(--faint)}
.composer{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);border-top:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer input{flex:1;min-width:0;height:36px;border:0;border-radius:18px;background:var(--soft);padding:0 14px;color:var(--fg);font:inherit;font-size:14px}
.composer button{color:var(--brand-ink);font-weight:700;font-size:14px;padding:6px 4px}

.board{background:linear-gradient(180deg,var(--mast),var(--mast-2));color:var(--on-mast);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.board-stage{text-align:center;font-size:12px;color:var(--on-mast-dim)}
.board-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board-team{display:grid;justify-items:center;gap:6px;font-size:14px}
.board-team small{font-size:11px;color:var(--on-mast-dim)}
.board-score{text-align:center}
.board-score b{font:700 46px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.board-score .st{display:block;margin-top:6px;color:var(--on-mast)}
.board-score .st.live::before{background:var(--on-mast)}
.situ{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px}
.situ svg{width:86px;height:86px;flex:none}
.count{display:grid;gap:6px;font:600 14px var(--f-num)}
.count div{display:flex;align-items:center;gap:6px}
.count span{width:12px;text-align:center;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dot.b.on{background:#2e9d5b}
.dot.s.on{background:var(--gold)}
.dot.o.on{background:var(--red)}

const API='https://statsapi.mlb.com/api';
const Live={state:'loading',games:null,standings:null,leaders:null,roster:{},coaches:{},feed:{},records:{}};
async function api(path,ms=8000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(API+path,{signal:ctl.signal});if(!r.ok)throw new Error(r.status);return await r.json();}
  finally{clearTimeout(t);}
}
function stageText(x){
  const d=x.seriesDescription||'',n=x.seriesGameNumber,post=/[FDLW]/.test(x.gameType);
  let s=/World Series/.test(d)?'世界大赛':/Championship/.test(d)?(/AL/.test(d)?'美联冠军赛':/NL/.test(d)?'国联冠军赛':'联盟冠军赛'):/Division/.test(d)?'分区系列赛':/Wild Card/.test(d)?'外卡系列赛':/Spring/.test(d)?'春训':x.gameType==='A'?'全明星赛':'常规赛';
  return post&&n?`${s} 第${n}场`:s;
}
function mapGame(x){
  const ls=x.linescore||{},inn=ls.innings||[],st=x.status||{};
  const side=k=>({t:ID2AB[x.teams[k].team.id],ln:inn.map(i=>i[k]&&i[k].runs),r:x.teams[k].score,
    h:(ls.teams&&ls.teams[k]&&ls.teams[k].hits)||0,e:(ls.teams&&ls.teams[k]&&ls.teams[k].errors)||0,
    sp:x.teams[k].probablePitcher&&x.teams[k].probablePitcher.fullName,rec:x.teams[k].leagueRecord});
  const g={id:'m'+x.gamePk,pk:x.gamePk,real:1,day:dayOf(x.gameDate),lg:'MLB',stage:stageText(x),venue:x.venue&&x.venue.name,
    time:(d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`)(new Date(x.gameDate)),a:side('away'),h:side('home'),
    status:st.abstractGameState==='Live'?'live':st.abstractGameState==='Final'?'final':'pre',detail:st.detailedState};
  if(g.status==='live'){const o=ls.offense||{};
    g.live={inn:ls.currentInning||1,half:ls.isTopInning===false?'bot':'top',outs:ls.outs||0,b:ls.balls||0,s:ls.strikes||0,
      bases:[!!o.first,!!o.second,!!o.third],batterName:o.batter&&o.batter.fullName};}
  return g;
}
async function loadSchedule(){
  const d=await api(`/v1/schedule?sportId=1&startDate=${ymd(dateAt(-4))}&endDate=${ymd(dateAt(4))}&hydrate=linescore,probablePitcher`);
  const out=[];(d.dates||[]).forEach(day=>day.games.forEach(x=>{if(ID2AB[x.teams.away.team.id]&&ID2AB[x.teams.home.team.id])out.push(mapGame(x));}));
  Live.games=out.sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));
}
async function loadStandings(){
  const d=await api(`/v1/standings?leagueId=103,104&season=${SEASON}&standingsTypes=regularSeason`);
  Live.standings=(d.records||[]).map(r=>[DIV_ID[r.division.id]||'',r.teamRecords.map(t=>{
    const ab=ID2AB[t.team.id];Live.records[ab]={w:t.wins,l:t.losses,rank:t.divisionRank,gb:t.gamesBack};
    return [ab,t.wins,t.losses,t.gamesBack];})]).filter(r=>r[0]).sort((a,b)=>Object.values(DIV_ID).indexOf(a[0])-Object.values(DIV_ID).indexOf(b[0]));
}
async function loadLeaders(){
  const q=(cats,grp)=>api(`/v1/stats/leaders?leaderCategories=${cats}&statGroup=${grp}&season=${SEASON}&sportId=1&limit=5`);
  const [h,p]=await Promise.all([q('homeRuns,battingAverage,runsBattedIn','hitting'),q('earnedRunAverage,strikeouts','pitching')]);
  const name={homeRuns:['全垒打','HR'],battingAverage:['打击率','AVG'],runsBattedIn:['打点','RBI'],earnedRunAverage:['防御率','ERA'],strikeouts:['三振','SO']};
  Live.leaders=[...(h.leagueLeaders||[]),...(p.leagueLeaders||[])].filter(c=>name[c.leaderCategory]).map(c=>[name[c.leaderCategory][0],name[c.leaderCategory][1],
    (c.leaders||[]).slice(0,5).map(l=>[l.person.fullName,ID2AB[l.team&&l.team.id],l.value])]);
}
async function loadTeamExtra(ab){
  const id=MLB[ab].id;
  const [r,c]=await Promise.all([
    api(`/v1/teams/${id}/roster?rosterType=active&season=${SEASON}`).catch(()=>null),
    api(`/v1/teams/${id}/coaches?season=${SEASON}`).catch(()=>null)]);
  if(r)Live.roster[ab]=(r.roster||[]).map(p=>({n:p.person.fullName,no:p.jerseyNumber,pos:p.position.abbreviation,type:p.position.type}));
  if(c)Live.coaches[ab]=(c.roster||[]).map(p=>({n:p.person.fullName,no:p.jerseyNumber,job:p.job}));
  if(!r&&!c)throw new Error('team');
}
async function loadFeed(pk){
  const d=await api(`/v1.1/game/${pk}/feed/live?fields=liveData,plays,allPlays,result,description,about,inning,halfInning,isScoringPlay`);
  Live.feed[pk]=((d.liveData&&d.liveData.plays&&d.liveData.plays.allPlays)||[]).filter(p=>p.result&&p.result.description).reverse().slice(0,30)
    .map(p=>[`${p.about.inning}局${p.about.halfInning==='top'?'上':'下'}`,p.result.description,p.about.isScoringPlay?1:0]);
}
async function boot(){
  try{await loadSchedule();Live.state='ok';}
  catch(e){Live.state='off';}
  render();
  if(Live.state!=='ok')return;
  Promise.all([loadStandings().catch(()=>{}),loadLeaders().catch(()=>{})]).then(()=>{if(S.tab==='stats')render();refreshSheet();});
  setInterval(async()=>{
    if(!Live.games||!Live.games.some(g=>g.status==='live'))return;
    try{await loadSchedule();}catch(e){return;}
    Live.games.forEach(g=>{
      document.querySelectorAll(`[data-gcard="${g.id}"]`).forEach(el=>el.outerHTML=gameCard(g));
      document.querySelectorAll(`[data-gmini="${g.id}"]`).forEach(el=>el.outerHTML=miniCard(g));});
    if(S.sheet&&S.sheet.kind==='game'){const g=G(S.sheet.id);if(g&&g.real&&g.status==='live')loadFeed(g.pk).catch(()=>{}).then(refreshSheet);}
  },30000);
}

/* ---------- live simulation (example mode only) ---------- */
function sim(){
  const g=SAMPLE_GAMES[0]; if(g.status!=='live')return;
  const L=g.live, bat=L.half==='top'?g.a:g.h, label=`${L.inn}局${L.half==='top'?'上':'下'}`;
  const r=Math.random(), order=`第${L.batter}棒`; let msg=null, scored=0;
  const next=()=>{L.batter=L.batter%9+1;L.b=0;L.s=0;};
  const adv=(n,walk)=>{let b=L.bases.slice(),rs=0;
    if(walk){if(b[0]&&b[1]&&b[2])rs++;if(b[0]&&b[1])b[2]=1;if(b[0])b[1]=1;b[0]=1;}
    else{for(let i=2;i>=0;i--)if(b[i]){b[i]=0;const to=i+n;if(to>=3)rs++;else b[to]=1;}if(n>=4)rs++;else b[n-1]=1;}
    L.bases=b;return rs;};
  if(r<.32){L.b++;if(L.b===4){scored=adv(1,1);msg=`${order} 四坏球保送`;next();}}
  else if(r<.62){L.s++;if(L.s===3){L.outs++;msg=`${order} 三振出局`;next();}}
  else if(r<.66){if(L.s<2)L.s++;}
  else if(r<.84){L.outs++;msg=`${order} ${['游击滚地球出局','中外野高飞球接杀','二垒滚地球出局','一垒方向平飞球接杀'][Math.floor(Math.random()*4)]}`;next();}
  else if(r<.94){scored=adv(1);bat.h++;msg=`${order} 一垒安打`;next();}
  else if(r<.985){scored=adv(2);bat.h++;msg=`${order} 二垒安打`;next();}
  else{scored=adv(4);bat.h++;msg=`${order} 全垒打`;next();}
  if(scored){bat.ln[bat.ln.length-1]+=scored;msg+=`，得${scored}分`;}
  if(msg)g.plays.unshift([label,msg,scored?1:0]);
  const end=m=>{g.status='final';g.plays.unshift(['终',m,1]);};
  if(L.half==='bot'&&L.inn>=9&&runs(g.h)>runs(g.a))return end('再见安打，比赛结束');
  if(L.outs>=3){
    if(L.half==='top'){if(L.inn>=9&&runs(g.h)>runs(g.a))return end('比赛结束');L.half='bot';g.h.ln.push(0);}
    else{if(L.inn>=9&&runs(g.h)!==runs(g.a))return end('比赛结束');L.half='top';L.inn++;g.a.ln.push(0);}
    L.outs=0;L.b=0;L.s=0;L.bases=[0,0,0];
    g.plays.unshift([`${L.inn}局${L.half==='top'?'上':'下'}`,'攻守交换']);
  }
}

  if(!g)return `<div class="sheet-h">${backBtn}<b>比赛</b><span class="side"></span></div><div class="empty">这场比赛已不在当前数据范围内</div>`;
  const ra=runs(g.a),rh=runs(g.h),pre=g.status==='pre';
  const tm=s=>`<${MLB[s.t]?`button data-teamp="${s.t}"`:'div'} class="board-team">${logo(s.t,'lg')}<span>${esc(team(s.t).n)}</span><small>${s===g.h?'主队':'客队'}${s.rec?` · ${s.rec.wins}-${s.rec.losses}`:''}</small></${MLB[s.t]?'button':'div'}>`;
  let h=`<div class="sheet-h dark">${backBtn}<b>${esc(LG_NAME[g.lg])} · ${esc(g.stage)}</b><span class="side"></span></div>
   <div class="board"><div class="board-main">${tm(g.a)}<div class="board-score">${pre?`<b style="font-size:32px">${esc(g.time)}</b>`:`<b>${ra} - ${rh}</b>`}<span class="st ${g.status}">${pre?(g.detail==='Postponed'?'延期':'未开始'):statusText(g)}</span></div>${tm(g.h)}</div>
   <div class="board-stage">${esc(g.venue||'')} · ${g.real?'MLB 官方数据':'示例数据'}</div></div><div class="wrap">`;
  if(g.status==='live'){
    const L=g.live,dots=(n,max,c)=>Array.from({length:max},(_,i)=>`<i class="dot ${c}${i<n?' on':''}"></i>`).join('');
    const atBat=L.half==='top'?g.a:g.h;
    h+=`<section class="panel"><div class="situ">${diamond(L.bases)}<div class="count"><div><span>B</span>${dots(L.b,3,'b')}</div><div><span>S</span>${dots(L.s,2,'s')}</div><div><span>O</span>${dots(L.outs,2,'o')}</div></div>
      <div class="situ-tx"><span>${esc(team(atBat.t).n)}进攻</span><b>${esc(L.batterName||`第${L.batter}棒`)}</b><span>${g.real?'每 30 秒刷新':'模拟比赛 · 自动推进'}</span></div></div></section>`;
  }
  if(!pre){
    const n=Math.max(9,g.a.ln.length,g.h.ln.length);
    const cells=s=>Array.from({length:n},(_,i)=>{const v=s.ln[i];return `<td>${v==null?(g.status==='final'&&s===g.h&&i===n-1&&g.a.ln.length===n?'X':''):v}</td>`;}).join('');
    h+=`<section class="panel"><div class="sec-h">逐局比分</div><div class="tbl-wrap"><table class="linescore"><thead><tr><th>球队</th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th></tr></thead>
      <tbody>${[g.a,g.h].map(s=>`<tr><td class="tm"><span class="t">${logo(s.t)}${esc(team(s.t).s)}</span></td>${cells(s)}<td class="rhe">${runs(s)}</td><td>${s.h}</td><td>${s.e}</td></tr>`).join('')}</tbody></table></div><div class="note">R 得分 · H 安打 · E 失误</div></section>`;
  }
  const plays=g.real?Live.feed[g.pk]:g.plays;
  if(g.real&&!pre&&!plays)h+=`<section class="panel"><div class="sec-h">文字直播</div><div class="empty">正在读取…</div></section>`;
  if(plays&&plays.length)h+=`<section class="panel"><div class="sec-h">文字直播${g.real?'<small>官方英文播报</small>':''}</div>${plays.slice(0,30).map(([t,m,r])=>`<div class="play${r?' run':''}"><small>${esc(t)}</small><span>${esc(m)}</span></div>`).join('')}</section>`;
  if(pre)h+=`<section class="panel"><div class="sec-h">比赛信息</div><dl class="kv"><dt>开赛时间</dt><dd>${dayLabel(g.day).num} ${esc(g.time)}（本地时间）</dd><dt>球场</dt><dd>${esc(g.venue||'待定')}</dd>${g.a.sp||g.h.sp?`<dt>预计先发</dt><dd>${esc(g.a.sp||'待定')} vs ${esc(g.h.sp||'待定')}</dd>`:''}</dl></section>`;
  return h+'</div>';
}
const POS_CN={P:'投手',SP:'先发投手',RP:'后援投手',C:'捕手','1B':'一垒手','2B':'二垒手','3B':'三垒手',SS:'游击手',LF:'左外野手',CF:'中外野手',RF:'右外野手',OF:'外野手',DH:'指定打击',TWP:'二刀流',IF:'内野手'};
const GROUPS=[['Pitcher','投手'],['Two-Way Player','二刀流'],['Catcher','捕手'],['Infielder','内野手'],['Outfielder','外野手'],['Hitter','指定打击']];
const JOB_CN={'Manager':'总教练','Bench Coach':'板凳教练','Hitting Coach':'打击教练','Assistant Hitting Coach':'助理打击教练','Pitching Coach':'投手教练','Assistant Pitching Coach':'助理投手教练',
  'Bullpen Coach':'牛棚教练','First Base Coach':'一垒指导教练','Third Base Coach':'三垒指导教练','Bullpen Catcher':'牛棚捕手','Major League Coach':'大联盟教练','Associate Manager':'副总教练','Field Coordinator':'场务协调','Quality Control Coach':'品质控管教练','Game Planning Coach':'比赛规划教练','Catching Coach':'捕手教练','Infield Coach':'内野教练','Outfield Coach':'外野教练'};
function sheetTeam(ab,tab){
  const t=MLB[ab],on=follows.includes(ab),rec=Live.records[ab];
  const ws=t.ws.length,age=SEASON-t.y+1;
  const tc=`style="--tc:${t.c}"`;
  let h=`<div class="sheet-h team" ${tc}>${backBtn}<b>${esc(t.n)}</b><span class="side"></span></div>
   <div class="thero" ${tc}>${I.seam}<div class="thero-main">${logo(ab,'xl')}<div><h2>${esc(t.city)}${esc(t.n)}</h2><small>${esc(t.en.toUpperCase())}</small><small>${esc(t.lg)}${esc(t.div)}</small></div></div>
   <div class="thero-stats"><div><b>${ws}</b>世界大赛冠军</div><div><b>${t.y}</b>建队年份</div><div><b>${age}</b>个赛季</div><div><b>${rec?`${rec.w}-${rec.l}`:'—'}</b>${rec?`${SEASON} 战绩`:'本季战绩'}</div></div>
   <button class="follow" data-follow="${ab}" aria-pressed="${on}">${on?'已关注':'+ 关注'}</button></div>
   <nav class="ttabs" role="tablist" ${tc}>${[['info','简介'],['history','历史'],['coaches','教练'],['roster','球员']].map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" data-ttab="${k}">${v}</button>`).join('')}</nav><div class="wrap">`;
  if(tab==='info'){
    h+=`<section class="panel"><div class="sec-h">球队简介</div><p class="prose">${esc(t.intro)}</p></section>
     <section class="panel"><div class="sec-h">基本信息</div><dl class="kv"><dt>所在城市</dt><dd>${esc(t.city)}</dd><dt>所属分区</dt><dd>${esc(t.lg)}${esc(t.div)}</dd><dt>主场</dt><dd>${esc(t.park)}</dd><dt>首个大联盟赛季</dt><dd>${t.y} 年</dd><dt>世界大赛冠军</dt><dd>${ws?ws+' 次':'暂无'}</dd>${t.ws.length?`<dt>最近一次夺冠</dt><dd>${t.ws[t.ws.length-1]} 年</dd>`:''}</dl></section>`;
    const games=(Live.state==='ok'?Live.games:SAMPLE_GAMES).filter(g=>g.a.t===ab||g.h.t===ab);
    if(games.length)h+=`<section class="panel"><div class="sec-h">近期比赛<small>${Live.state==='ok'?'官方数据':'示例'}</small></div>${games.map(gameCard).join('')}</section>`;
  }else if(tab==='history'){
    h+=`<section class="panel"><div class="sec-h">世界大赛冠军<small>${ws} 次 · 截至2025赛季</small></div>${ws?`<div class="titles">${t.ws.map(y=>`<span>${y}</span>`).join('')}</div>`:'<div class="empty">还没有拿过世界大赛冠军</div>'}</section>
     <section class="panel"><div class="sec-h">队史传奇</div>${t.leg.map((p,i)=>`<div class="legend"><span class="no">${pad(i+1)}</span>${esc(p)}</div>`).join('')}</section>
     <section class="panel"><div class="sec-h">沿革</div><p class="prose">${esc(t.intro)}</p></section>`;
  }else{
    const isRoster=tab==='roster',data=isRoster?Live.roster[ab]:Live.coaches[ab];
    if(Live.state!=='ok')h+=`<section class="panel"><div class="empty">${isRoster?'球员名单':'教练团'}来自 MLB 官方实时数据。<br>当前环境无法连接 statsapi.mlb.com，部署到普通网页后即可显示。</div></section>`;
    else if(!data)h+=`<section class="panel"><div class="empty">正在读取${isRoster?'球员名单':'教练团'}…</div></section>`;
    else if(!data.length)h+=`<section class="panel"><div class="empty">暂无数据</div></section>`;
    else if(isRoster){
      h+=`<section class="panel">${GROUPS.map(([k,v])=>{const ps=data.filter(p=>p.type===k);if(!ps.length)return '';
        return `<div class="grp"><span>${v}</span><span>${ps.length}人</span></div>${ps.map(p=>`<div class="prow"><span class="jn">${esc(p.no||'-')}</span><span>${esc(p.n)}</span><em>${esc(POS_CN[p.pos]||p.pos)}</em></div>`).join('')}`;}).join('')}<div class="note">${SEASON} 赛季 26 人现役名单 · MLB 官方数据</div></section>`;
    }else{
      const mgr=data.filter(c=>c.job==='Manager'),rest=data.filter(c=>c.job!=='Manager');
      h+=`<section class="panel">${[...mgr,...rest].map(c=>`<div class="prow"><span class="jn">${esc(c.no||'-')}</span><span>${esc(c.n)}<small>${esc(c.job)}</small></span><em>${esc(JOB_CN[c.job]||'教练组')}</em></div>`).join('')}<div class="note">${SEASON} 赛季教练团 · MLB 官方数据</div></section>`;
    }
  }
  return h+'</div>';
}
function sheetSearch(q){
  const kw=q.trim(),lo=kw.toLowerCase();
  if(!kw)return `<section class="panel"><div class="sec-h">美职棒球队</div>${teamGrid()}</section>`;
  const ns=NEWS.filter(n=>n.title.includes(kw));
  const ts=Object.values(MLB).filter(t=>t.n.includes(kw)||t.city.includes(kw)||t.ab.toLowerCase()===lo||t.en.toLowerCase().includes(lo));
  if(!ns.length&&!ts.length)return `<div class="empty">没有找到和“${esc(kw)}”相关的内容</div>`;
  let r='';
  if(ts.length)r+=`<section class="panel"><div class="sec-h">球队</div><div class="teamlist">${ts.map(t=>`<button class="tcell" data-teamp="${t.ab}">${logo(t.ab,'md')}<span><b style="font-weight:500">${esc(t.n)}</b><small>${esc(t.city)}</small></span></button>`).join('')}</div></section>`;
  if(ns.length)r+=`<section class="panel">${ns.map(newsRow).join('')}</section>`;
  return r;
}

/* ---------- render ---------- */
const TABS=[['home','首页'],['games','比赛'],['stats','数据'],['circle','圈子'],['me','我的']];
const VIEWS={home:viewHome,games:viewGames,stats:viewStats,circle:viewCircle,me:viewMe};
function render(){
  const v=VIEWS[S.tab]();
  $('#mast').innerHTML=v.mast;$('#main').innerHTML=v.main;
  $('#tabbar').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${k===S.tab?'aria-current="page"':''}>${I[k]}<span>${l}</span></button>`).join('');
}
function sheetHTML(){
  const s=S.sheet;
  if(s.kind==='news')return sheetArticle(NEWS.find(n=>n.id===s.id));
  if(s.kind==='game')return sheetGame(G(s.id));
  if(s.kind==='team')return sheetTeam(s.id,s.tab);
}
function openSheet(kind,id){
  S.sheet={kind,id,tab:'info'};
  const root=$('#sheet-root');
  if(kind==='search'){
    root.innerHTML=`<div class="sheet"><div class="sheet-h">${backBtn}<input class="search-in" id="search-in" placeholder="搜索球队（中文、英文或缩写）、新闻" autocomplete="off"></div><div class="wrap" id="search-res">${sheetSearch('')}</div></div>`;
    $('#search-in').focus();
  }else root.innerHTML=`<div class="sheet">${sheetHTML()}</div>`;
  document.body.style.overflow='hidden';
  if(kind==='game'){const g=G(id);if(g&&g.real&&g.status!=='pre')loadFeed(g.pk).catch(()=>{Live.feed[g.pk]=[];}).then(refreshSheet);}
}
function refreshSheet(){
  const s=S.sheet,el=$('#sheet-root .sheet');if(!s||!el)return;
  if(s.kind==='search'){$('#search-res').innerHTML=sheetSearch($('#search-in').value);return;}
  const top=el.scrollTop;el.innerHTML=sheetHTML();el.scrollTop=top;
}
function closeSheet(){S.sheet=null;$('#sheet-root').innerHTML='';document.body.style.overflow='';}
function setTeamTab(tab){
  S.sheet.tab=tab;refreshSheet();
  const ab=S.sheet.id;
  if((tab==='roster'||tab==='coaches')&&Live.state==='ok'&&!Live.roster[ab]&&!Live.coaches[ab])
    loadTeamExtra(ab).catch(()=>{Live.roster[ab]=Live.roster[ab]||[];Live.coaches[ab]=Live.coaches[ab]||[];}).then(()=>{if(S.sheet&&S.sheet.id===ab)refreshSheet();});
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400);}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){S.tab=d.tab;closeSheet();render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+d.tab)}catch(_){}}
  else if(d.ch){S.ch=d.ch;render();window.scrollTo(0,0);}
  else if(d.lg){S.lg=d.lg;render();}
  else if(d.day!==undefined){S.day=+d.day;render();}
  else if(d.slg){S.slg=d.slg;render();}
  else if(d.sview){S.sview=d.sview;render();}
  else if(d.teamp){if(S.sheet&&S.sheet.kind==='team'){S.sheet.id=d.teamp;setTeamTab('info');$('#sheet-root .sheet').scrollTop=0;}else openSheet('team',d.teamp);}
  else if(d.ttab)setTeamTab(d.ttab);
  else if(d.news)openSheet('news',d.news);
  else if(d.game)openSheet('game',d.game);
  else if(d.act==='search')openSheet('search');
  else if(d.act==='close')closeSheet();
  else if(d.act==='src')toast(Live.state==='ok'?'美职棒比分、积分榜、球员与教练来自 MLB 官方实时数据':Live.state==='loading'?'正在连接 MLB 官方数据…':'无法连接 MLB 官方数据，美职棒部分显示示例数据');
  else if(d.like){liked.has(d.like)?liked.delete(d.like):liked.add(d.like);store.set('liked',[...liked]);render();}
  else if(d.follow){
    const t=d.follow,on=follows.includes(t);
    follows=on?follows.filter(x=>x!==t):[...follows,t];store.set('follows',follows);
    toast(on?`已取消关注${team(t).n}`:`已关注${team(t).n}`);render();refreshSheet();
  }
  else if(d.themeSet){theme=d.themeSet;store.set('theme',theme);applyTheme();render();}
});
document.addEventListener('input',e=>{if(e.target.id==='search-in')$('#search-res').innerHTML=sheetSearch(e.target.value);});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-comment]');if(!f)return;e.preventDefault();
  const v=$('#cmt-in').value.trim();if(!v)return;
  (myComments[f.dataset.comment]=myComments[f.dataset.comment]||[]).unshift(['棒球新手',v,'刚刚',0]);
  toast('评论已发布');refreshSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();});

setInterval(()=>{
  if(Live.state==='ok')return;
  const g=SAMPLE_GAMES[0];if(g.status!=='live')return;
  sim();
  document.querySelectorAll('[data-gcard="g1"]').forEach(el=>el.outerHTML=gameCard(g));
  document.querySelectorAll('[data-gmini="g1"]').forEach(el=>el.outerHTML=miniCard(g));
  if(S.sheet&&S.sheet.id==='g1')refreshSheet();
},3500);

const h=(location.hash||'').slice(1);if(VIEWS[h])S.tab=h;
render();
boot();
})();
</script>
