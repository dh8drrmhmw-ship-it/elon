<title>本垒棒球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app column — green masthead with channel tabs, white list feed, fixed bottom tab bar, full-screen sheets for detail views */
:root{
  --mast:#12a150; --brand:#12a150; --brand-ink:#0b7a3c; --brand-soft:#e3f5ea; --on-brand:#ffffff; --on-team:#ffffff;
  --bg:#eef2ef; --card:#ffffff; --fg:#16201a; --muted:#6a786f; --faint:#9aa8a0; --line:#e1e7e3; --soft:#f4f7f5;
  --live:#e0463b; --live-soft:#fdeceb; --gold:#c98a0b; --shadow:0 1px 0 rgba(20,40,28,.04);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mast:#0e5a31; --brand:#2cc070; --brand-ink:#5fd697; --brand-soft:#173826; --on-brand:#ffffff; --on-team:#ffffff;
    --bg:#0c110e; --card:#151c18; --fg:#e5ece7; --muted:#8c9a91; --faint:#5f6d65; --line:#232e28; --soft:#1b241f;
    --live:#ff6a5c; --live-soft:#3a1d1a; --gold:#f0b43a; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mast:#0e5a31; --brand:#2cc070; --brand-ink:#5fd697; --brand-soft:#173826; --on-brand:#ffffff; --on-team:#ffffff;
  --bg:#0c110e; --card:#151c18; --fg:#e5ece7; --muted:#8c9a91; --faint:#5f6d65; --line:#232e28; --soft:#1b241f;
  --live:#ff6a5c; --live-soft:#3a1d1a; --gold:#f0b43a; --shadow:none; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mast)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--mast);color:var(--on-brand);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.mast-top{display:flex;align-items:center;gap:12px;min-height:36px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;letter-spacing:.04em;white-space:nowrap}
.brand svg{width:22px;height:22px}
.mast h1{margin:0;font-size:18px;font-weight:700;flex:1}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
  background:rgba(255,255,255,.18);color:rgba(255,255,255,.85);font-size:13px;white-space:nowrap;overflow:hidden}
.search svg{width:15px;height:15px;flex:none}
.sample{font-size:11px;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,.2);white-space:nowrap}
.channels{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.channels::-webkit-scrollbar{display:none}
.channels button{position:relative;padding:8px 0 10px;font-size:15px;color:rgba(255,255,255,.75);white-space:nowrap}
.channels button[aria-selected="true"]{color:var(--on-brand);font-weight:700;font-size:17px}
.channels button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:4px;width:18px;height:3px;border-radius:2px;background:var(--on-brand);transform:translateX(-50%)}
.mast-pad{height:10px}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;display:grid;gap:12px}
.panel{background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px;font-weight:700;font-size:15px}
.sec-h small{font-weight:400;font-size:12px;color:var(--muted)}

/* live strip */
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 14px}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:148px;padding:10px;border-radius:8px;background:var(--soft);display:grid;gap:6px}
.mini-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.mini-row{display:flex;align-items:center;gap:6px;font-size:13px}
.mini-row b{margin-left:auto;font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mini-row .lose{color:var(--muted)}

/* logos & art */
.logo{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tc);color:var(--on-team);
  font:600 10px/1 var(--f-body);letter-spacing:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.logo.lg{width:52px;height:52px;font-size:16px}
.logo.md{width:34px;height:34px;font-size:12px}
.art{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--on-team);
  background:linear-gradient(120deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
.art.solo{background:linear-gradient(135deg,var(--brand-ink),var(--brand))}
.art .seam{position:absolute;right:-18%;top:-30%;width:90%;aspect-ratio:1;opacity:.14;color:var(--on-team)}
.art i{font:italic 700 18px var(--f-num);position:relative}
.art .label{position:relative;font-weight:700;font-size:22px;letter-spacing:.08em}
.art .logo{position:relative}

/* hero + news */
.hero{display:block;width:100%}
.hero .art{aspect-ratio:16/8;max-width:100%}
.hero .art .logo{width:64px;height:64px;font-size:18px}
.hero-t{padding:12px 14px 14px;font-size:18px;font-weight:700;line-height:1.4;text-wrap:balance}
.hero-t .news-m{margin-top:8px;font-weight:400}
.news{display:flex;gap:12px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news-tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.news-t{font-size:16px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.news .art{flex:none;width:112px;height:74px;border-radius:6px}
.news .art .logo{width:26px;height:26px;font-size:10px}
.news .art i{font-size:13px}
.news .art .label{font-size:14px}
.tag{font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;color:var(--brand-ink);background:var(--brand-soft)}
.tag.hot{color:var(--live);background:var(--live-soft)}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px}

/* games */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:8px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:4px 12px;border-radius:14px;font-size:13px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.9)}
.chip[aria-pressed="true"]{background:var(--on-brand);color:var(--brand-ink);font-weight:700}
.dates{display:flex;justify-content:space-between;gap:4px;padding-block:8px 10px}
.dates button{flex:1;min-width:0;display:grid;justify-items:center;padding:4px 0;border-radius:8px;color:rgba(255,255,255,.75);font-size:11px}
.dates button b{font:600 17px var(--f-num)}
.dates button[aria-pressed="true"]{background:rgba(255,255,255,.2);color:var(--on-brand)}
.lg-h{font-size:13px;color:var(--muted);padding-inline:2px;display:flex;justify-content:space-between}
.game{display:grid;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.g-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.g-row{display:flex;align-items:center;gap:10px;font-size:15px}
.g-row span{flex:1;min-width:0}
.g-row b{font:600 24px/1 var(--f-num);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.g-row.lose{color:var(--muted)}
.g-row .pre{font-size:13px;color:var(--faint);font-weight:400}
.st{font-size:12px;font-weight:500;white-space:nowrap}
.st.live{color:var(--live);display:inline-flex;align-items:center;gap:5px}
.st.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.st.final{color:var(--muted)}
.st.pre{color:var(--brand-ink)}
@keyframes pulse{50%{opacity:.25}}

/* stats */
.seg{display:flex;background:var(--soft);border-radius:8px;padding:3px;margin:12px 14px 4px}
.seg button{flex:1;text-align:center;padding:6px;border-radius:6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:right;padding:8px 6px}
td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td.tm{font-family:var(--f-body);font-size:14px}
td.tm span{display:inline-flex;align-items:center;gap:8px}
.rk{display:inline-block;width:16px;color:var(--faint);font-family:var(--f-num)}
.rk.top{color:var(--brand-ink);font-weight:700}
.leader{padding:4px 0 8px}
.leader h3{margin:0;padding:10px 14px 4px;font-size:14px;display:flex;justify-content:space-between}
.leader h3 small{font-weight:400;color:var(--faint);font-size:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:14px}
.lrow span{flex:1;min-width:0}
.lrow b{font:600 18px var(--f-num);font-variant-numeric:tabular-nums}
.lrow:first-of-type b{color:var(--brand-ink)}
.note{font-size:12px;color:var(--faint);padding:8px 14px 12px}

/* circle */
.circles{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 14px}
.circles::-webkit-scrollbar{display:none}
.circle{flex:none;display:grid;justify-items:center;gap:4px;width:62px;font-size:12px}
.circle small{color:var(--faint);font-size:11px}
.post{padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.post:first-child{border-top:0}
.post-h{display:flex;align-items:center;gap:10px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--on-team);background:var(--tc)}
.post-h div{flex:1;min-width:0;display:grid}
.post-h b{font-size:14px;font-weight:500}
.post-h small{font-size:12px;color:var(--faint)}
.post p{margin:0;font-size:15px}
.post-f{display:flex;gap:22px;font-size:13px;color:var(--muted)}
.post-f button{display:inline-flex;align-items:center;gap:4px}
.post-f svg{width:16px;height:16px}
.post-f [aria-pressed="true"]{color:var(--live)}
.post-f [aria-pressed="true"] svg path{fill:currentColor}
.ctag{font-size:12px;color:var(--brand-ink)}

/* me */
.profile{display:flex;align-items:center;gap:14px;padding:18px 14px}
.profile .avatar{width:56px;height:56px;font-size:22px;--tc:var(--brand)}
.profile div{display:grid;gap:2px}
.profile b{font-size:18px}
.profile small{color:var(--muted);font-size:13px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:12px 0}
.counts div{display:grid;justify-items:center;font-size:12px;color:var(--muted)}
.counts b{font:600 20px var(--f-num);color:var(--fg)}
.follow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:8px 14px 14px}
.fbtn{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;background:var(--soft);font-size:13px;border:1px solid transparent;min-width:0}
.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.menu-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-top:1px solid var(--line);font-size:15px;gap:12px}
.menu-row:first-child{border-top:0}
.menu-row small{color:var(--muted);font-size:13px}
.seg.inline{margin:0;padding:2px}
.seg.inline button{padding:3px 10px;font-size:12px}

/* bottom nav */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:15;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;display:grid;justify-items:center;gap:1px;padding:7px 0 6px;font-size:11px;color:var(--muted)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--brand)}

/* sheets */
.sheet{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translate(-50%,24px);opacity:.4}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:48px;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h.green{background:var(--mast);color:var(--on-brand);border-bottom:0}
.sheet-h b{flex:1;min-width:0;font-size:16px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:32px}
.back{width:40px;height:40px;display:grid;place-items:center}
.back svg{width:22px;height:22px}
.sheet-h .search-in{flex:1;min-width:0;height:34px;border-radius:17px;border:0;padding:0 14px;background:var(--soft);color:var(--fg);font:inherit;font-size:14px}

.article{background:var(--card);padding:18px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.article h2{margin:0 0 10px;font-size:22px;line-height:1.4;text-wrap:balance}
.article .news-m{margin-bottom:16px}
.article .art{aspect-ratio:16/8;max-width:100%;border-radius:8px;margin-bottom:16px}
.article .art .logo{width:60px;height:60px;font-size:18px}
.article p{margin:0 0 14px;font-size:16px;line-height:1.8;max-width:65ch}
.article .formula{font-family:var(--f-num);font-size:17px;background:var(--soft);border-radius:6px;padding:10px 12px}
.cmts{background:var(--card);margin-top:10px;padding-bottom:80px}
.cmt{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.cmt .avatar{width:30px;height:30px;font-size:13px}
.cmt div{flex:1;min-width:0;display:grid;gap:2px}
.cmt b{font-size:13px;font-weight:500;color:var(--muted)}
.cmt p{margin:0;font-size:15px}
.cmt small{font-size:12px;color:var(--faint)}
.composer{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);border-top:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer input{flex:1;min-width:0;height:36px;border:0;border-radius:18px;background:var(--soft);padding:0 14px;color:var(--fg);font:inherit;font-size:14px}
.composer button{color:var(--brand);font-weight:700;font-size:14px;padding:6px 4px}

.board{background:var(--mast);color:var(--on-brand);padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.board-stage{text-align:center;font-size:13px;opacity:.85}
.board-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board-team{display:grid;justify-items:center;gap:6px;font-size:14px}
.board-team small{font-size:11px;opacity:.75}
.board-score{text-align:center}
.board-score b{font:700 44px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.board-score .st{display:block;margin-top:6px;color:var(--on-brand)}
.board-score .st.live::before{background:var(--on-brand)}
.situ{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px;background:var(--card)}
.situ svg{width:86px;height:86px}
.count{display:grid;gap:6px;font:600 14px var(--f-num)}
.count div{display:flex;align-items:center;gap:6px}
.count span{width:12px;text-align:center;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dot.b.on{background:var(--brand)}
.dot.s.on{background:var(--gold)}
.dot.o.on{background:var(--live)}
.situ-tx{font-size:13px;color:var(--muted);display:grid;gap:2px}
.situ-tx b{color:var(--fg);font-size:15px}
.linescore th,.linescore td{text-align:center;padding:7px 4px;font-size:14px}
.linescore th:first-child,.linescore td:first-child{text-align:left}
.linescore td.rhe{font-weight:700}
.linescore th.rhe{color:var(--fg)}
.plays{display:grid}
.play{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.play small{flex:none;width:44px;color:var(--faint);font-size:12px;padding-top:2px}
.play.run{color:var(--live);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:8px 14px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--card);
  padding:8px 16px;border-radius:18px;font-size:13px;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="mast" id="mast"></header>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('benlei_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('benlei_'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- icons ---------- */
const I={
  ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9.5" stroke-width="1.8"/><path d="M7 4.6c1.9 2 2.7 4.5 2.7 7.4s-.8 5.4-2.7 7.4M17 4.6c-1.9 2-2.7 4.5-2.7 7.4s.8 5.4 2.7 7.4" stroke-width="1.4" stroke-dasharray="1.6 1.4"/></svg>',

const G=id=>GAMES.find(g=>g.id===id);
const runs=s=>s.ln?sum(s.ln):0;
function statusText(g){
  if(g.status==='live'){const L=g.live;return `${L.inn}局${L.half==='top'?'上':'下'} · ${L.outs}出局`;}
  if(g.status==='final')return '完赛';
  return g.time+' 开赛';
}

/* ---------- live simulation ---------- */
function sim(){
  const g=G('g1'); if(g.status!=='live')return;
  const L=g.live, bat=L.half==='top'?g.a:g.h, label=`${L.inn}局${L.half==='top'?'上':'下'}`;
  const r=Math.random(); let msg=null, scored=0;
  const order=`第${L.batter}棒`;
  const nextBatter=()=>{L.batter=L.batter%9+1;L.b=0;L.s=0;};
  const advance=(n,forced)=>{
    let b=L.bases.slice(), runs=0;
    if(forced){ // walk: force only
      if(b[0]&&b[1]&&b[2])runs++;
      if(b[0]&&b[1])b[2]=1; if(b[0])b[1]=1; b[0]=1;
    }else{
      for(let i=2;i>=0;i--){if(b[i]){b[i]=0;const to=i+n;if(to>=3)runs++;else b[to]=1;}}
      if(n>=4)runs++;else b[n-1]=1;
    }
    L.bases=b;return runs;
  };
  if(r<.32){L.b++; if(L.b===4){scored=advance(1,true);msg=`${order} 四坏球保送`;nextBatter();}}
  else if(r<.62){L.s++; if(L.s===3){L.outs++;msg=`${order} 三振出局`;nextBatter();}}
  else if(r<.66){if(L.s<2)L.s++;}
  else if(r<.84){L.outs++;msg=`${order} ${['游击滚地球出局','中外野高飞球接杀','二垒滚地球出局','一垒方向平飞球接杀'][Math.floor(Math.random()*4)]}`;nextBatter();}
  else if(r<.94){scored=advance(1);bat.h++;msg=`${order} 一垒安打`;nextBatter();}
  else if(r<.985){scored=advance(2);bat.h++;msg=`${order} 二垒安打`;nextBatter();}
  else{scored=advance(4);bat.h++;msg=`${order} ${scored>1?scored+'分':'个人'}全垒打`;nextBatter();}
  if(scored){bat.ln[bat.ln.length-1]+=scored;msg+=`，得${scored}分`;}
  if(msg)g.plays.unshift([label,msg,scored?1:0]);
  // walk-off
  if(L.half==='bot'&&L.inn>=9&&runs(g.h)>runs(g.a)){endGame(g,'再见安打！比赛结束');return;}
  if(L.outs>=3){
    if(L.half==='top'){
      if(L.inn>=9&&runs(g.h)>runs(g.a)){endGame(g,'比赛结束');return;}
      L.half='bot';g.h.ln.push(0);
    }else{
      if(L.inn>=9&&runs(g.h)!==runs(g.a)){endGame(g,'比赛结束');return;}
      L.half='top';L.inn++;g.a.ln.push(0);
    }
    L.outs=0;L.b=0;L.s=0;L.bases=[0,0,0];
    g.plays.unshift([`${L.inn}局${L.half==='top'?'上':'下'}`,'攻守交换']);
  }
}
function endGame(g,msg){g.status='final';g.plays.unshift(['终',msg,1]);}

/* ---------- state ---------- */
const S={tab:'home',ch:'头条',day:0,lg:'全部',slg:'MLB',sview:'table',sheet:null};
let follows=store.get('follows',['LAD','TOR']);
let liked=new Set(store.get('liked',[]));
let theme=store.get('theme','system');
const myComments={};
function applyTheme(){const r=document.documentElement;if(theme==='system')delete r.dataset.theme;else r.dataset.theme=theme;}
applyTheme();

/* ---------- render helpers ---------- */
function art(n){
  if(n.art.length===2){const[a,b]=n.art;return `<div class="art" style="--c1:${TEAMS[a].c};--c2:${TEAMS[b].c}">${I.seam}${logo(a)}<i>VS</i>${logo(b)}</div>`;}
  return `<div class="art solo">${I.seam}<span class="label">${esc(n.art[0])}</span></div>`;
}
function newsMeta(n){return `<div class="news-m">${n.tag?`<span class="tag${n.hot?' hot':''}">${esc(n.tag)}</span>`:''}<span>${esc(n.src)}</span><span>${esc(n.time)}</span><span>${n.cm+(myComments[n.id]||[]).length}评</span></div>`;}
function newsRow(n){return `<button class="news" data-news="${n.id}"><div class="news-tx"><div class="news-t">${esc(n.title)}</div>${newsMeta(n)}</div>${art(n)}</button>`;}
function miniCard(g){
  const ra=runs(g.a),rh=runs(g.h),pre=g.status==='pre';
  const row=(s,r,o)=>`<div class="mini-row">${logo(s.t)}<span class="${!pre&&g.status==='final'&&r<o?'lose':''}">${esc(TEAMS[s.t].n)}</span><b>${pre?'':r}</b></div>`;
  return `<button class="mini" data-game="${g.id}" data-gmini="${g.id}"><div class="mini-meta"><span>${esc(LG_NAME[g.lg])}</span><span class="st ${g.status}">${g.status==='live'?`${g.live.inn}局${g.live.half==='top'?'上':'下'}`:statusText(g)}</span></div>${row(g.a,ra,rh)}${row(g.h,rh,ra)}</button>`;
}
function gameCard(g){
  const ra=runs(g.a),rh=runs(g.h),pre=g.status==='pre',fin=g.status==='final';
  const row=(s,r,o)=>`<div class="g-row${fin&&r<o?' lose':''}">${logo(s.t,'md')}<span>${esc(TEAMS[s.t].n)}${s===g.h?' <small style="color:var(--faint);font-size:12px">主</small>':''}</span>${pre?'':`<b>${r}</b>`}</div>`;
  return `<button class="game" data-game="${g.id}" data-gcard="${g.id}"><div class="g-meta"><span>${esc(g.stage)}</span><span class="st ${g.status}">${statusText(g)}</span></div>${row(g.a,ra,rh)}${row(g.h,rh,ra)}</button>`;
}
function dayLabel(d){
  const base=new Date(2026,9,24);base.setDate(base.getDate()+d);
  const wk='日一二三四五六'[base.getDay()];
  return {top:d===0?'今天':d===-1?'昨天':d===1?'明天':'周'+wk,num:`${base.getMonth()+1}/${base.getDate()}`};
}

/* ---------- views ---------- */
function viewHome(){
  const mast=`<div class="mast-top"><div class="brand">${I.ball}本垒</div><button class="search" data-act="search">${I.search}搜索球队、球员、新闻</button></div>
   <nav class="channels" role="tablist">${CHANNELS.map(c=>`<button role="tab" aria-selected="${c===S.ch}" data-ch="${c}">${c}</button>`).join('')}</nav>`;
  const list=NEWS.filter(n=>n.ch.includes(S.ch));
  const today=GAMES.filter(g=>g.day===0);
  let main='<div class="wrap">';
  if(S.ch==='头条'){
    main+=`<section class="panel"><div class="sec-h">今日比赛<small>示例数据 · 点击查看</small></div><div class="strip">${today.map(miniCard).join('')}</div></section>`;
  }
  if(list.length){
    const [first,...rest]=list;
    main+=`<section class="panel"><button class="hero" data-news="${first.id}">${art(first)}<div class="hero-t">${esc(first.title)}${newsMeta(first)}</div></button></section>`;
    if(rest.length)main+=`<section class="panel">${rest.map(newsRow).join('')}</section>`;
  }else main+=`<section class="panel"><div class="empty">这个频道暂时没有新内容</div></section>`;
  return {mast,main:main+'</div>'};
}
function viewGames(){
  const days=[-3,-2,-1,0,1,2,3];
  const mast=`<div class="mast-top"><h1>比赛</h1><span class="sample">示例数据</span></div>
   <div class="chips">${['全部',...LEAGUES].map(l=>`<button class="chip" aria-pressed="${l===S.lg}" data-lg="${l}">${l==='全部'?'全部':LG_NAME[l]}</button>`).join('')}</div>
   <div class="dates">${days.map(d=>{const L=dayLabel(d);return `<button aria-pressed="${d===S.day}" data-day="${d}"><span>${L.top}</span><b>${L.num}</b></button>`}).join('')}</div>`;
  const list=GAMES.filter(g=>g.day===S.day&&(S.lg==='全部'||g.lg===S.lg));
  let main='<div class="wrap">';
  if(!list.length)main+=`<section class="panel"><div class="empty">这一天没有比赛安排</div></section>`;
  LEAGUES.forEach(l=>{const gs=list.filter(g=>g.lg===l);if(!gs.length)return;
    main+=`<div class="lg-h"><span>${esc(LG_NAME[l])}</span><span>${gs.length}场</span></div><section class="panel">${gs.map(gameCard).join('')}</section>`;});
  return {mast,main:main+'</div>'};
}
function viewStats(){
  const mast=`<div class="mast-top"><h1>数据</h1><span class="sample">示例数据</span></div>
   <div class="chips" style="padding-bottom:10px">${LEAGUES.map(l=>`<button class="chip" aria-pressed="${l===S.slg}" data-slg="${l}">${esc(LG_NAME[l])}</button>`).join('')}</div>`;
  let main=`<div class="wrap"><section class="panel"><div class="seg"><button aria-pressed="${S.sview==='table'}" data-sview="table">积分榜</button><button aria-pressed="${S.sview==='lead'}" data-sview="lead">球员榜</button></div>`;
  if(S.sview==='table'){
    STANDINGS[S.slg].forEach(([grp,rows])=>{
      const sorted=rows.slice().sort((x,y)=>y[1]/(y[1]+y[2])-x[1]/(x[1]+x[2]));
      const [,lw,ll]=sorted[0];
      main+=`<div class="sec-h">${esc(grp)}</div><div class="tbl-wrap"><table><thead><tr><th>球队</th><th>胜</th><th>负</th><th>胜率</th><th>胜差</th></tr></thead><tbody>${sorted.map(([t,w,l],i)=>{
        const gb=((lw-w)+(l-ll))/2;
        return `<tr><td class="tm"><span><i class="rk${i<3?' top':''}">${i+1}</i>${logo(t)}${esc(TEAMS[t].n)}</span></td><td>${w}</td><td>${l}</td><td>${(w/(w+l)).toFixed(3).replace(/^0/,'')}</td><td>${gb===0?'-':gb.toFixed(1)}</td></tr>`;}).join('')}</tbody></table></div>`;
    });
    main+=`<div class="note">胜率 = 胜场 ÷ (胜场 + 负场)；胜差 = 与第一名相差的场数。</div>`;
  }else{
    const L=LEADERS[S.slg];
    if(L)L.forEach(([name,abbr,rows])=>{main+=`<div class="leader"><h3>${esc(name)}<small>${abbr}</small></h3>${rows.map(([p,t,v],i)=>`<div class="lrow"><i class="rk${i===0?' top':''}">${i+1}</i>${logo(t)}<span>${esc(p)} <small style="color:var(--faint)">${esc(TEAMS[t].n)}</small></span><b>${v}</b></div>`).join('')}</div>`;});
    else main+=`<div class="empty">${esc(LG_NAME[S.slg])}球员榜还没有接入，先看看美职棒吧</div>`;
  }
  return {mast,main:main+'</section></div>'};
}
function postHTML(p){
  const on=liked.has(p.id);
  return `<article class="post"><div class="post-h"><span class="avatar" style="--tc:${p.c}">${esc(p.u[0])}</span><div><b>${esc(p.u)}</b><small>${esc(p.time)}</small></div>${p.t?`<span class="ctag">#${esc(TEAMS[p.t].n)}圈</span>`:''}</div>
   <p>${esc(p.tx)}</p><div class="post-f"><button data-like="${p.id}" aria-pressed="${on}">${I.heart}<span>${p.lk+(on?1:0)}</span></button><span style="display:inline-flex;align-items:center;gap:4px">${I.chat}${p.cm}</span></div></article>`;
}
function viewCircle(){
  const mast=`<div class="mast-top"><h1>圈子</h1></div><div class="mast-pad"></div>`;
  const main=`<div class="wrap"><section class="panel"><div class="sec-h">热门球队圈<small>左右滑动</small></div><div class="circles">${CIRCLES.map(t=>`<button class="circle" data-team="${t}">${logo(t,'lg')}<span>${esc(TEAMS[t].n)}</span><small>${follows.includes(t)?'已加入':'加入'}</small></button>`).join('')}</div></section>
   <section class="panel">${POSTS.map(postHTML).join('')}</section></div>`;

}
function viewMe(){
  const mast=`<div class="mast-top"><h1>我的</h1></div>`;
  const main=`<div class="wrap" style="padding-top:0">
   <section class="panel" style="border-radius:0 0 10px 10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))"><div class="profile" style="background:var(--mast);color:var(--on-brand)"><span class="avatar" style="--tc:rgba(255,255,255,.22)">棒</span><div><b>棒球新手</b><small style="color:rgba(255,255,255,.8)">示例账号 · 看球第 37 天</small></div></div></section>
   <section class="panel"><div class="counts"><div><b class="num">${follows.length}</b>关注球队</div><div><b class="num">${liked.size}</b>点赞</div><div><b class="num">${Object.values(myComments).flat().length}</b>评论</div><div><b class="num">12</b>收藏</div></div></section>
   <section class="panel"><div class="sec-h">我关注的球队<small>点击切换</small></div><div class="follow-grid">${Object.keys(TEAMS).map(t=>`<button class="fbtn" data-follow="${t}" aria-pressed="${follows.includes(t)}">${logo(t)}<span>${esc(TEAMS[t].n)}</span></button>`).join('')}</div></section>
   <section class="panel"><div class="menu-row"><span>外观</span><div class="seg inline">${[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([k,v])=>`<button data-theme-set="${k}" aria-pressed="${theme===k}">${v}</button>`).join('')}</div></div>
     <div class="menu-row"><span>比赛提醒</span><small>关注球队开赛前 15 分钟</small></div>
     <div class="menu-row"><span>关于本垒</span><small>v0.1 演示版</small></div></section></div>`;

/* ---------- sheets ---------- */
function sheetArticle(n){
  if(n.game)return sheetGame(G(n.game));
  const body=(n.body||[]).map(b=>typeof b==='string'?`<p>${esc(b)}</p>`:`<p class="formula">${esc(b.f)}</p>`).join('');
  const cm=[...(myComments[n.id]||[]),...(COMMENTS[n.id]||[])];
  return `<div class="sheet-h"><button class="back" data-act="close" aria-label="返回">${I.back}</button><b>${esc(n.src)}</b></div>
   <article class="article"><h2>${esc(n.title)}</h2>${newsMeta(n)}${art(n)}${body}</article>
   <section class="cmts"><div class="sec-h">评论<small>${cm.length?cm.length+'条':''}</small></div>${cm.length?cm.map(([u,t,time,lk])=>`<div class="cmt"><span class="avatar" style="--tc:var(--brand)">${esc(u[0])}</span><div><b>${esc(u)}</b><p>${esc(t)}</p><small>${esc(time)}${lk?` · ${lk}赞`:''}</small></div></div>`).join(''):'<div class="empty">还没有评论，来说第一句</div>'}</section>
   <form class="composer" data-comment="${n.id}"><input id="cmt-in" maxlength="200" placeholder="说点什么…" autocomplete="off"><button type="submit">发送</button></form>`;
}
function diamond(b){
  const base=(x,y,on)=>`<rect x="${x-8}" y="${y-8}" width="16" height="16" transform="rotate(45 ${x} ${y})" fill="${on?'var(--live)':'var(--card)'}" stroke="${on?'var(--live)':'var(--faint)'}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 100 100" aria-label="垒上情况"><path d="M50 88 88 50 50 12 12 50z" fill="none" stroke="var(--line)" stroke-width="2"/>${base(88,50,b[0])}${base(50,12,b[1])}${base(12,50,b[2])}<path d="M44 84h12l0 6-6 5-6-5z" fill="var(--faint)"/></svg>`;
}
function sheetGame(g){
  const ra=runs(g.a),rh=runs(g.h),pre=g.status==='pre';
  const team=s=>`<div class="board-team">${logo(s.t,'lg')}<span>${esc(TEAMS[s.t].n)}</span><small>${s===g.h?'主队':'客队'}</small></div>`;
  let h=`<div class="sheet-h green"><button class="back" data-act="close" aria-label="返回">${I.back}</button><b>${esc(LG_NAME[g.lg])} · ${esc(g.stage)}</b></div>
   <div class="board"><div class="board-main">${team(g.a)}<div class="board-score">${pre?`<b style="font-size:30px">${esc(g.time)}</b>`:`<b>${ra} - ${rh}</b>`}<span class="st ${g.status}">${pre?'未开始':statusText(g)}</span></div>${team(g.h)}</div><div class="board-stage">${esc(g.venue)} · 示例数据</div></div>`;
  h+='<div class="wrap">';
  if(g.status==='live'){
    const L=g.live,dots=(n,max,c)=>Array.from({length:max},(_,i)=>`<i class="dot ${c}${i<n?' on':''}"></i>`).join('');
    h+=`<section class="panel"><div class="situ">${diamond(L.bases)}<div class="count"><div><span>B</span>${dots(L.b,3,'b')}</div><div><span>S</span>${dots(L.s,2,'s')}</div><div><span>O</span>${dots(L.outs,2,'o')}</div></div>
      <div class="situ-tx"><span>${L.half==='top'?TEAMS[g.a.t].n:TEAMS[g.h.t].n}进攻</span><b>第${L.batter}棒打击中</b><span>每几秒自动更新</span></div></div></section>`;
  }
  if(!pre){
    const n=Math.max(9,g.a.ln.length,g.h.ln.length);
    const cells=s=>Array.from({length:n},(_,i)=>`<td>${s.ln[i]===undefined?(g.status==='final'&&s===g.h&&i===8?'X':''):s.ln[i]}</td>`).join('');
    h+=`<section class="panel"><div class="sec-h">逐局比分</div><div class="tbl-wrap"><table class="linescore"><thead><tr><th>球队</th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th></tr></thead>
      <tbody>${[g.a,g.h].map(s=>`<tr><td class="tm"><span>${logo(s.t)}${esc(TEAMS[s.t].s)}</span></td>${cells(s)}<td class="rhe">${runs(s)}</td><td>${s.h}</td><td>${s.e}</td></tr>`).join('')}</tbody></table></div><div class="note">R 得分 · H 安打 · E 失误</div></section>`;
  }
  if(g.plays)h+=`<section class="panel"><div class="sec-h">文字直播</div><div class="plays">${g.plays.slice(0,30).map(([t,m,r])=>`<div class="play${r?' run':''}"><small>${esc(t)}</small><span>${esc(m)}</span></div>`).join('')}</div></section>`;
  if(pre)h+=`<section class="panel"><div class="sec-h">比赛信息</div><dl class="kv"><dt>开赛时间</dt><dd>${dayLabel(g.day).num} ${esc(g.time)}</dd><dt>球场</dt><dd>${esc(g.venue)}</dd><dt>预计先发</dt><dd>${esc(g.sp[0])} vs ${esc(g.sp[1])}</dd></dl></section>`;
  if(g.status==='final'&&!g.plays)h+=`<section class="panel"><div class="sec-h">赛果</div><dl class="kv"><dt>胜方</dt><dd>${esc(TEAMS[(ra>rh?g.a:g.h).t].n)}</dd><dt>球场</dt><dd>${esc(g.venue)}</dd></dl></section>`;
  return h+'</div>';
}
function sheetSearch(q){
  const kw=q.trim();
  const ns=kw?NEWS.filter(n=>n.title.includes(kw)):[];
  const ts=kw?Object.keys(TEAMS).filter(t=>TEAMS[t].n.includes(kw)||t.toLowerCase().includes(kw.toLowerCase())):[];
  let r='';
  if(!kw)r=`<div class="empty">试试搜索"道奇"、"阪神"或"OPS"</div>`;
  else if(!ns.length&&!ts.length)r=`<div class="empty">没有找到和"${esc(kw)}"相关的内容</div>`;
  else{
    if(ts.length)r+=`<section class="panel"><div class="sec-h">球队</div><div class="follow-grid">${ts.map(t=>`<button class="fbtn" data-follow="${t}" aria-pressed="${follows.includes(t)}">${logo(t)}<span>${esc(TEAMS[t].n)}</span></button>`).join('')}</div></section>`;
    if(ns.length)r+=`<section class="panel">${ns.map(newsRow).join('')}</section>`;
  }
  return r;
}

/* ---------- render ---------- */
const TABS=[['home','首页'],['games','比赛'],['stats','数据'],['circle','圈子'],['me','我的']];
const VIEWS={home:viewHome,games:viewGames,stats:viewStats,circle:viewCircle,me:viewMe};
function render(){
  const v=VIEWS[S.tab]();
  $('#mast').innerHTML=v.mast;$('#main').innerHTML=v.main;
  $('#tabbar').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${k===S.tab?'aria-current="page"':''}>${I[k]}<span>${l}</span></button>`).join('');
}
function openSheet(kind,id){
  S.sheet={kind,id};
  const root=$('#sheet-root');
  if(kind==='search'){
    root.innerHTML=`<div class="sheet"><div class="sheet-h"><button class="back" data-act="close" aria-label="返回">${I.back}</button><input class="search-in" id="search-in" placeholder="搜索球队、新闻" autocomplete="off"></div><div class="wrap" id="search-res">${sheetSearch('')}</div></div>`;
    $('#search-in').focus();
  }else root.innerHTML=`<div class="sheet">${kind==='news'?sheetArticle(NEWS.find(n=>n.id===id)):sheetGame(G(id))}</div>`;
  document.body.style.overflow='hidden';
}
function refreshSheet(){
  const s=S.sheet,el=$('#sheet-root .sheet');if(!s||!el)return;
  if(s.kind==='search'){$('#search-res').innerHTML=sheetSearch($('#search-in').value);return;}
  const top=el.scrollTop;
  el.innerHTML=s.kind==='news'?sheetArticle(NEWS.find(n=>n.id===s.id)):sheetGame(G(s.id));
  el.scrollTop=top;
}
function closeSheet(){S.sheet=null;$('#sheet-root').innerHTML='';document.body.style.overflow='';}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1600);}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){S.tab=d.tab;closeSheet();render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+d.tab)}catch(_){}}
  else if(d.ch){S.ch=d.ch;render();window.scrollTo(0,0);}
  else if(d.lg){S.lg=d.lg;render();}
  else if(d.day!==undefined){S.day=+d.day;render();}
  else if(d.slg){S.slg=d.slg;render();}
  else if(d.sview){S.sview=d.sview;render();}
  else if(d.news)openSheet('news',d.news);
  else if(d.game)openSheet('game',d.game);
  else if(d.act==='search')openSheet('search');
  else if(d.act==='close')closeSheet();
  else if(d.like){liked.has(d.like)?liked.delete(d.like):liked.add(d.like);store.set('liked',[...liked]);render();}
  else if(d.follow||d.team){
    const t=d.follow||d.team,on=follows.includes(t);
    follows=on?follows.filter(x=>x!==t):[...follows,t];store.set('follows',follows);
    toast(on?`已取消关注${TEAMS[t].n}`:`已关注${TEAMS[t].n}`);render();refreshSheet();
  }
  else if(d.themeSet){theme=d.themeSet;store.set('theme',theme);applyTheme();render();}
});
document.addEventListener('input',e=>{if(e.target.id==='search-in')$('#search-res').innerHTML=sheetSearch(e.target.value);});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-comment]');if(!f)return;e.preventDefault();
  const v=$('#cmt-in').value.trim();if(!v)return;
  (myComments[f.dataset.comment]=myComments[f.dataset.comment]||[]).unshift(['棒球新手',v,'刚刚',0]);
  toast('评论已发布');refreshSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();});

setInterval(()=>{
  const g=G('g1');if(g.status!=='live')return;
  sim();
  document.querySelectorAll('[data-gcard="g1"]').forEach(el=>el.outerHTML=gameCard(g));
  document.querySelectorAll('[data-gmini="g1"]').forEach(el=>el.outerHTML=miniCard(g));
  if(S.sheet&&(S.sheet.id==='g1'||S.sheet.id==='n1'))refreshSheet();
},3500);

const h=(location.hash||'').slice(1);if(VIEWS[h])S.tab=h;
render();
})();
