<title>本垒棒球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: phone-width app column — deep navy masthead with channel tabs, cool-white card feed, fixed bottom tab bar, full-screen sheets for game / team / article detail */
:root{
  --mast:#0a1d3f; --mast-2:#06142e; --on-mast:#ffffff; --on-mast-dim:rgba(225,233,247,.68); --mast-glass:rgba(255,255,255,.1);
  --brand:#1f5fd1; --brand-ink:#1849a8; --brand-soft:#e7eefb; --red:#c8102e; --red-soft:#fbe9ec; --gold:#b8862b;
  --bg:#f1f3f7; --card:#ffffff; --fg:#0c1628; --muted:#5d6a80; --faint:#97a1b3; --line:#e4e8ef; --soft:#f5f7fa;
  --on-team:#ffffff; --crest-bg:#ffffff; --scrim:#000000; --shadow:0 1px 2px rgba(10,29,63,.05);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mast:#08152d; --mast-2:#040b1a; --on-mast:#ffffff; --on-mast-dim:rgba(210,220,240,.62); --mast-glass:rgba(255,255,255,.08);
    --brand:#7aa5ff; --brand-ink:#93b6ff; --brand-soft:#15254a; --red:#ff5468; --red-soft:#3a1720; --gold:#e0b25a;
    --bg:#060b15; --card:#0e1626; --fg:#e8edf6; --muted:#8b97ad; --faint:#5b677d; --line:#1b2639; --soft:#131d30;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mast:#08152d; --mast-2:#040b1a; --on-mast:#ffffff; --on-mast-dim:rgba(210,220,240,.62); --mast-glass:rgba(255,255,255,.08);
  --brand:#7aa5ff; --brand-ink:#93b6ff; --brand-soft:#15254a; --red:#ff5468; --red-soft:#3a1720; --gold:#e0b25a;
  --bg:#060b15; --card:#0e1626; --fg:#e8edf6; --muted:#8b97ad; --faint:#5b677d; --line:#1b2639; --soft:#131d30;
  --shadow:none; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mast)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;color:var(--on-mast);background:linear-gradient(180deg,var(--mast),var(--mast-2));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.mast-top{display:flex;align-items:center;gap:12px;min-height:36px}
.brand{display:flex;align-items:center;gap:7px;font:900 21px/1 var(--f-display);letter-spacing:.06em;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--on-mast)}
.mast h1{margin:0;font:700 19px var(--f-display);letter-spacing:.06em;flex:1}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
  background:var(--mast-glass);color:var(--on-mast-dim);font-size:13px;white-space:nowrap;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.search svg{width:15px;height:15px;flex:none}
.src{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:10px;background:var(--mast-glass);color:var(--on-mast-dim);white-space:nowrap}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.src.ok{color:var(--on-mast)}
.src.ok::before{background:#3ddc84}
.src.off::before{background:#f2b84b}
.channels{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.channels::-webkit-scrollbar{display:none}
.channels button{position:relative;padding:8px 0 11px;font-size:15px;color:var(--on-mast-dim);white-space:nowrap}
.channels button[aria-selected="true"]{color:var(--on-mast);font-weight:700;font-size:16px}
.channels button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:4px;width:16px;height:2px;background:var(--red);transform:translateX(-50%)}
.mast-pad{height:12px}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;display:grid;gap:12px}
.panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 5px;font-weight:700;font-size:15px}
.sec-h small{font-weight:400;font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}

/* live strip */
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 14px}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;padding:10px;border-radius:10px;background:var(--soft);display:grid;gap:6px}
.mini-meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted)}
.mini-row{display:flex;align-items:center;gap:6px;font-size:13px}
.mini-row b{margin-left:auto;font:600 19px var(--f-num);font-variant-numeric:tabular-nums}
.lose{color:var(--muted)}

/* logos & art */
.logo{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tc);color:var(--on-team);
  font:700 9.5px/1 var(--f-num);letter-spacing:.02em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.logo b{font:inherit}
.logo.crest{background:var(--crest-bg);box-shadow:inset 0 0 0 1px var(--line)}
.logo.crest img{width:76%;height:76%;object-fit:contain}
.logo.crest b{display:none}
.logo.cn{font:600 9.5px/1 var(--f-body)}
.logo.md{width:34px;height:34px;font-size:12px}
.logo.lg{width:54px;height:54px;font-size:17px}
.logo.xl{width:72px;height:72px;font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.25)}
.art{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--on-team);
  background:linear-gradient(115deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18))}
.art.solo{background:radial-gradient(120% 140% at 85% 0%,#1d4b9a 0%,var(--mast) 55%,var(--mast-2) 100%)}
.art .seam{position:absolute;right:-16%;top:-34%;width:88%;aspect-ratio:1;opacity:.12;color:var(--on-team)}
.art i{font:italic 700 18px var(--f-num);position:relative;z-index:1;opacity:.85}
.art .label{position:relative;z-index:1;font:900 22px var(--f-display);letter-spacing:.12em}
.art .logo{position:relative;z-index:1}

/* hero + news */
.hero{display:block;width:100%}
.hero .art{aspect-ratio:16/8;max-width:100%}
.hero .art .logo{width:66px;height:66px;font-size:20px}
.hero-t{padding:13px 14px 14px;font-size:18px;font-weight:700;line-height:1.45;text-wrap:balance}
.hero-t .news-m{margin-top:8px;font-weight:400}
.news{display:flex;gap:12px;width:100%;padding:13px 14px;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news-tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.news-t{font-size:16px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.news .art{flex:none;width:112px;height:74px;border-radius:8px}
.news .art .logo{width:26px;height:26px;font-size:9px}
.news .art i{font-size:12px}
.news .art .label{font-size:15px}
.tag{font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;color:var(--brand-ink);background:var(--brand-soft)}
.tag.hot{color:var(--red);background:var(--red-soft)}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.notice b{color:var(--fg);font-weight:500}

/* games */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:8px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:4px 12px;border-radius:14px;font-size:13px;background:var(--mast-glass);color:var(--on-mast-dim)}
.chip[aria-pressed="true"]{background:var(--on-mast);color:var(--mast);font-weight:700}
.dates{display:flex;justify-content:space-between;gap:4px;padding-block:8px 10px}
.dates button{flex:1;min-width:0;display:grid;justify-items:center;padding:4px 0;border-radius:8px;color:var(--on-mast-dim);font-size:11px}
.dates button b{font:600 17px var(--f-num)}
.dates button[aria-pressed="true"]{background:var(--mast-glass);color:var(--on-mast);box-shadow:inset 0 -2px 0 var(--red)}
.lg-h{font-size:13px;color:var(--muted);padding-inline:2px;display:flex;justify-content:space-between}
.game{display:grid;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.g-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.g-row{display:flex;align-items:center;gap:10px;font-size:15px}
.g-row>span:not(.logo){flex:1;min-width:0}
.g-row span small{color:var(--faint);font-size:12px}
.g-row b{font:600 25px/1 var(--f-num);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.g-row em{font-style:normal;font-size:12px;color:var(--faint);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;font-weight:500;white-space:nowrap}
.st.live{color:var(--red);display:inline-flex;align-items:center;gap:5px}
.st.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
.st.final{color:var(--muted)}
.st.pre{color:var(--brand-ink)}
@keyframes pulse{50%{opacity:.25}}

/* stats */
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;margin:12px 14px 4px}
.seg button{flex:1;text-align:center;padding:6px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(10,29,63,.1)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:right;padding:8px 6px}
td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td.tm{font-family:var(--f-body);font-size:14px}
td.tm button,td.tm span.t{display:inline-flex;align-items:center;gap:8px}
.rk{display:inline-block;width:16px;color:var(--faint);font-family:var(--f-num);font-style:normal}
.rk.top{color:var(--brand-ink);font-weight:700}
.leader{padding:4px 0 8px}
.leader h3{margin:0;padding:10px 14px 4px;font-size:14px;display:flex;justify-content:space-between}
.leader h3 small{font-weight:400;color:var(--faint);font-size:12px;letter-spacing:.08em}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:14px;width:100%}
.lrow>span:not(.logo){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow b{font:600 18px var(--f-num);font-variant-numeric:tabular-nums}
.leader .lrow:first-of-type b{color:var(--brand-ink)}
.note{font-size:12px;color:var(--faint);padding:8px 14px 12px;line-height:1.6}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:6px 14px 14px}
.tcell{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:var(--soft);font-size:14px;min-width:0}
.tcell span{display:grid;min-width:0}
.tcell small{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* circle */
.circles{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 14px}
.circles::-webkit-scrollbar{display:none}
.circle{flex:none;display:grid;justify-items:center;gap:4px;width:62px;font-size:12px}
.circle small{color:var(--faint);font-size:11px}
.circle[aria-pressed="true"] span,.circle[aria-pressed="true"] small{color:var(--brand-ink);font-weight:600}
.post{padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.post:first-child{border-top:0}
.post-h{display:flex;align-items:center;gap:10px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--on-team);background:var(--tc)}
.post-h div{flex:1;min-width:0;display:grid}
.post-h b{font-size:14px;font-weight:500}
.post-h small{font-size:12px;color:var(--faint)}
.post p{margin:0;font-size:15px}
.post-f{display:flex;gap:22px;font-size:13px;color:var(--muted)}
.post-f button,.post-f span{display:inline-flex;align-items:center;gap:4px}
.post-f svg{width:16px;height:16px}
.post-f [aria-pressed="true"]{color:var(--red)}
.post-f [aria-pressed="true"] svg path{fill:currentColor}
.ctag{font-size:12px;color:var(--brand-ink)}

/* me */
.profile{display:flex;align-items:center;gap:14px;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,var(--mast-2),var(--mast));color:var(--on-mast)}
.profile .avatar{width:56px;height:56px;font-size:22px;background:var(--mast-glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.profile div{display:grid;gap:2px}
.profile b{font:700 18px var(--f-display);letter-spacing:.04em}
.profile small{color:var(--on-mast-dim);font-size:13px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 0}
.counts div{display:grid;justify-items:center;font-size:12px;color:var(--muted)}
.counts b{font:600 21px var(--f-num);color:var(--fg)}
.follow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:8px 14px 14px}
.fbtn{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;background:var(--soft);font-size:13px;border:1px solid transparent;min-width:0}
.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.menu-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-top:1px solid var(--line);font-size:15px;gap:12px}
.menu-row:first-child{border-top:0}
.menu-row small{color:var(--muted);font-size:13px;text-align:right}
.seg.inline{margin:0;padding:2px}
.seg.inline button{padding:3px 10px;font-size:12px}

/* bottom nav */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:15;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:1px;padding:7px 0 6px;font-size:11px;color:var(--faint)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--brand-ink);font-weight:500}

/* sheets */
.sheet{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translate(-50%,24px);opacity:.4}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:48px;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h.dark{background:var(--mast);color:var(--on-mast);border-bottom:0}
.sheet-h.team{background:var(--tc);color:var(--on-team);border-bottom:0}
.sheet-h b{flex:1;min-width:0;font-size:16px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .side{width:40px;flex:none}
.back{width:40px;height:40px;display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.sheet-h .search-in{flex:1;min-width:0;height:34px;border-radius:17px;border:0;padding:0 14px;background:var(--soft);color:var(--fg);font:inherit;font-size:14px}

.article{background:var(--card);padding:18px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.article h2{margin:0 0 10px;font:700 22px/1.45 var(--f-display);text-wrap:balance}
.article .news-m{margin-bottom:16px}
.article .art{aspect-ratio:16/8;max-width:100%;border-radius:10px;margin-bottom:16px}
.article .art .logo{width:60px;height:60px;font-size:18px}
.article p{margin:0 0 14px;font-size:16px;line-height:1.85;max-width:65ch}
.art-x{margin:0 -16px 8px}
.art-x .panel{border-radius:0;box-shadow:none;border-top:8px solid var(--bg)}
.article .story p{margin:6px 0 8px;font-size:15px;line-height:1.75}
.gif{margin:10px 0 4px}
.gif-v{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9}
.gif-v video{width:100%;height:100%;object-fit:cover;display:block}
.gif-b{position:absolute;left:8px;top:8px;font-size:11px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}
.gif-full{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px}
.gif-full span{display:flex;align-items:center;gap:4px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:12px}
.gif-full svg{width:12px;height:12px}
.hitd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:0 0 6px}
.hitd b{color:var(--red);font-family:var(--f-num);font-size:14px}
.story{padding:12px 16px;border-top:1px solid var(--line)}
.story-h{display:flex;justify-content:space-between;align-items:baseline}
.story-h small{color:var(--faint);font-size:12px}
.story-h b{font:700 16px var(--f-num)}
.tops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px 14px}
.topp{display:grid;justify-items:center;align-content:start;gap:3px;text-align:center;padding:12px 4px;border-radius:10px;background:var(--soft);min-width:0}
.topp .pshot{width:52px;height:52px;font-size:20px;background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.topp b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topp small{font-size:11px;color:var(--faint)}
.topp span{font-size:12px;line-height:1.45}
.wp{display:block;width:100%}
.turn{display:grid;gap:3px;margin:4px 14px 8px;padding:10px 12px;border-radius:10px;background:var(--red-soft)}
.turn em{font-style:normal;font-size:12px;font-weight:700;color:var(--red)}
.turn span{font-size:14px;line-height:1.6}
.turn small{font-size:12px;color:var(--muted)}
.turn b{color:var(--red)}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:start;display:block;text-align:left}
.slide .art{aspect-ratio:16/9;border-radius:0;margin:0;width:100%}
.slide-t{position:absolute;left:0;right:0;bottom:0;padding:36px 14px 22px;color:#fff;font:700 17px/1.4 var(--f-display);background:linear-gradient(transparent,rgba(0,0,0,.78))}
.dots{position:relative;display:flex;justify-content:center;gap:5px;margin:-14px 12px 0;height:14px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5)}
.dots i.on{width:14px;background:#fff}
.vcard{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.vc-img{position:relative;aspect-ratio:16/9;border-radius:10px;background:#000 center/cover no-repeat;margin-bottom:8px}
.vc-img .playb{position:absolute;inset:0;margin:auto;width:46px;height:46px}
.vc-img .du{position:absolute;right:8px;bottom:8px;font:600 12px var(--f-num);color:#fff;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:4px}
.vcard b{display:block;font-size:16px;line-height:1.5;font-weight:600}
.vcard small{font-size:12px;color:var(--faint)}
.topic{color:var(--brand-ink);font-weight:500}
.article .formula{font-family:var(--f-num);font-size:17px;background:var(--soft);border-left:3px solid var(--brand);border-radius:0 6px 6px 0;padding:10px 12px}
.cmts{background:var(--card);margin-top:10px;padding-bottom:80px}
.cmt{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.cmt .avatar{width:30px;height:30px;font-size:13px}
.cmt div{flex:1;min-width:0;display:grid;gap:2px}
.cmt b{font-size:13px;font-weight:500;color:var(--muted)}
.cmt p{margin:0;font-size:15px}
.cmt small{font-size:12px;color:var(--faint)}
.composer{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);border-top:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer input{flex:1;min-width:0;height:36px;border:0;border-radius:18px;background:var(--soft);padding:0 14px;color:var(--fg);font:inherit;font-size:14px}
.composer button{color:var(--brand-ink);font-weight:700;font-size:14px;padding:6px 4px}

.board{background:linear-gradient(180deg,var(--mast),var(--mast-2));color:var(--on-mast);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.board-stage{text-align:center;font-size:12px;color:var(--on-mast-dim)}
.board-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board-team{display:grid;justify-items:center;gap:6px;font-size:14px}
.board-team small{font-size:11px;color:var(--on-mast-dim)}
.board-score{text-align:center}
.board-score b{font:700 46px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.board-score .st{display:block;margin-top:6px;color:var(--on-mast)}
.board-score .st.live::before{background:var(--on-mast)}
.situ{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px}
.situ svg{width:86px;height:86px;flex:none}
.count{display:grid;gap:6px;font:600 14px var(--f-num)}
.count div{display:flex;align-items:center;gap:6px}
.count span{width:12px;text-align:center;color:var(--muted)}
.sim{background:#0f2418;color:#e9f2ec}
.sim-sb{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0a1a10;font-size:13px}
.sim-t{padding:3px 8px;border-radius:4px;background:var(--c);color:#fff;font-weight:700;font-size:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sim-sc{font:700 20px var(--f-num);min-width:58px;text-align:center}
.sim-inn{margin-left:auto;font-weight:600}.sim-cnt{font:600 13px var(--f-num);color:#b9d3c2;min-width:26px}
.sim-outs{display:flex;gap:3px}.sim-outs i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}.sim-outs i.on{background:#ff5468}
.sim-f{display:block;width:100%;background:#163a24}
.sim-f .fd text,.sim-f .rn text{font-family:var(--f-num)}.sim-f .nm{paint-order:stroke;stroke:#0a1a10;stroke-width:1.6px}
.sim-cap{padding:10px 14px;min-height:64px;background:#0a1a10;border-top:1px solid rgba(255,255,255,.08)}
.sim-k{display:block;font-size:11px;color:#8fb39c;margin-bottom:3px}
.sim-tx{margin:0;font-size:15px;line-height:1.6}.sim-tx.run{color:#ffd166;font-weight:700}
.sim-ctl{display:flex;align-items:center;gap:8px;padding:8px 12px}
.sim-ctl button{padding:0 10px;height:32px;font-size:13px!important;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:15px}
.sim-ctl .sim-spd{font:700 13px var(--f-num)}.sim-pos{margin-left:auto;font-size:12px;color:#8fb39c}
.sim-inns{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.sim-inns button{flex:none;padding:4px 10px;border-radius:12px;font-size:12px;background:rgba(255,255,255,.08);color:#cfe3d6}
.sim-log{padding:0 12px}.sim-log div{display:grid;grid-template-columns:44px 1fr auto;gap:6px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.5}
.sim-log small{color:#8fb39c}.sim-log .run span{color:#ffd166}.sim-log b{font-family:var(--f-num)}
.sim .note{color:#8fb39c}
.live-h{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
.live-h b{font-size:15px}.live-h small{margin-left:auto;font-size:11px;color:var(--faint)}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:8px 14px}
.matchup>i{font:900 16px var(--f-display);font-style:italic;color:var(--gold)}
.mu{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.mu .pshot{width:56px;height:56px;font-size:20px;background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.mu small{font-size:11px;color:var(--faint)}.mu b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu span{font-size:11px;color:var(--muted)}
.live-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:4px 14px}
.live-l{display:grid;justify-items:center;gap:10px}.live-l svg{width:96px;height:96px}
.zone{display:block;width:100%;max-width:180px;margin:0 auto}
.zleg{display:flex;justify-content:center;gap:10px;font-size:11px;color:var(--muted)}
.zleg span{display:flex;align-items:center;gap:3px}.zleg i{width:8px;height:8px;border-radius:50%}
.pitches{padding:6px 14px 0}
.pitch{display:grid;grid-template-columns:22px auto 1fr auto;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pitch i{width:20px;height:20px;border-radius:50%;color:#fff;font:700 11px/20px var(--f-num);font-style:normal;text-align:center}
.pitch small{font-size:12px;color:var(--faint)}.pitch b{font-size:13px;font-weight:500}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dot.b.on{background:#2e9d5b}
.dot.s.on{background:var(--gold)}
.dot.o.on{background:var(--red)}
.situ-tx{font-size:13px;color:var(--muted);display:grid;gap:2px;min-width:0}
.situ-tx b{color:var(--fg);font-size:15px;overflow:hidden;text-overflow:ellipsis}
.linescore th,.linescore td{text-align:center;padding:7px 4px;font-size:14px}
.linescore th:first-child,.linescore td:first-child{text-align:left}
.linescore td.rhe{font-weight:700}
.linescore th.rhe{color:var(--fg)}
.play{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.play small{flex:none;width:44px;color:var(--faint);font-size:12px;padding-top:2px}
.play span{min-width:0}
.play.run{color:var(--red);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;padding:8px 14px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}

/* team page */
.thero{position:relative;overflow:hidden;color:var(--on-team);background:linear-gradient(160deg,var(--tc) 0%,var(--tc) 40%,var(--mast-2) 140%);
  padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.thero .seam{position:absolute;right:-20%;top:-10%;width:70%;aspect-ratio:1;opacity:.1}
.thero-main{display:flex;align-items:center;gap:14px;position:relative}
.thero-main div{display:grid;gap:2px;min-width:0}
.thero h2{margin:0;font:900 26px/1.15 var(--f-display);letter-spacing:.04em}
.thero small{font-size:12px;opacity:.78;letter-spacing:.06em}
.thero-stats{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(0,0,0,.18);border-radius:10px;padding:10px 4px}
.thero-stats div{display:grid;justify-items:center;font-size:11px;opacity:.9}
.thero-stats b{font:700 20px var(--f-num)}
.follow{position:relative;justify-self:start;padding:6px 16px;border-radius:16px;font-size:13px;font-weight:500;background:var(--on-team);color:var(--tc)}
.fa{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.fa-p{display:grid;gap:2px;min-width:0}
.fa-p b{font-size:15px;font-weight:500}
.fa-p small{font-size:12px;color:var(--faint)}
.fa-p em{font-style:normal;font-weight:700;color:var(--red)}
.fa-t{display:flex;align-items:center;gap:5px;font-size:13px;justify-self:end}
.fa-t>span{display:flex;align-items:center;gap:5px}
.fa-t i{font-style:normal;color:var(--faint)}
.fa-open{padding:1px 7px;border-radius:4px;background:var(--brand-soft);color:var(--brand-ink);font-size:12px}
.fa-n{grid-column:1/-1;font-size:12px;color:var(--muted)}
.fa-f{display:flex;gap:8px;flex-wrap:wrap;padding:6px 14px 10px}
.fa-f button{padding:4px 12px;border-radius:14px;font-size:12px;background:var(--soft);color:var(--muted)}
.fa-f button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 14px}
.award{display:grid;justify-items:center;gap:4px;padding:14px 8px 12px;border-radius:12px;background:var(--soft);text-align:center;min-width:0}
.award:first-child{grid-column:1/-1;background:linear-gradient(160deg,var(--mast) 0%,var(--mast-2) 120%);color:var(--on-mast)}
.award .pshot{width:64px;height:64px;font-size:24px;background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.award:first-child .pshot{width:84px;height:84px;background:rgba(255,255,255,.14);color:var(--on-mast)}
.award small{font-size:12px;color:var(--gold);font-weight:600}
.award b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.award:first-child span{color:var(--on-mast-dim)}
.bell{flex:none;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--brand-soft);color:var(--brand-ink)}
.bell[aria-pressed="true"]{background:var(--brand);color:#fff}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.duo>div{min-width:0}.duo .mini{width:100%}
.duo-k{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;min-height:24px}
.thero-acts{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.myteam{color:var(--on-team);background:linear-gradient(160deg,var(--tc) 0%,var(--tc) 45%,var(--mast-2) 150%)}
.myteam-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;color:inherit}
.myteam-h div{flex:1;display:grid;gap:3px;min-width:0}
.myteam-h b{font:900 19px var(--f-display);letter-spacing:.04em}
.myteam-h small{font-size:12px;opacity:.85;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.myteam-h em{font-style:normal;font-size:11px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.18)}
.myteam-h .go{font-size:13px;opacity:.85}
.myteam-sub{padding:10px 14px 2px;font-size:12px;color:var(--faint)}
.follow[aria-pressed="true"]{background:rgba(255,255,255,.18);color:var(--on-team);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.ttabs{position:sticky;top:48px;z-index:3;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.ttabs button{flex:1;padding:11px 0;text-align:center;font-size:14px;color:var(--muted);position:relative}
.ttabs button[aria-selected="true"]{color:var(--fg);font-weight:700}
.ttabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;width:20px;height:2px;background:var(--tc);transform:translateX(-50%)}
.prose{padding:4px 14px 14px;font-size:15px;line-height:1.85;margin:0}
.titles{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 14px}
.titles span{font:600 15px var(--f-num);padding:3px 9px;border-radius:5px;background:var(--soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:15px}
.legend:first-of-type{border-top:0}
.legend .no{font:700 15px var(--f-num);color:var(--faint);width:22px}
.prow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.prow .jn{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 15px var(--f-num);background:var(--soft);color:var(--muted)}
.prow>span:not(.jn){flex:1;min-width:0;display:grid}
.prow small{font-size:12px;color:var(--faint)}
.prow em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.grp{padding:12px 14px 6px;font-size:12px;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between}
/* postseason bracket */
.wsbar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px}
.wsbar .eyebrow{color:var(--red)}
.wsbar div{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.wsbar b{font:700 20px var(--f-num)}
.wsbar svg{width:16px;height:16px;color:var(--faint);transform:rotate(180deg)}
.round-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 14px 6px}
.round-h b{font-size:15px}
.round-h small{font-size:12px;color:var(--faint)}
.bcols{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.bcol{display:grid;gap:8px;align-content:start;min-width:0}
.bcol h4{margin:0;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.12em}
.series{display:grid;gap:6px;width:100%;padding:10px;border-radius:10px;background:var(--soft);min-width:0}
.sr{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.sr>span:not(.logo){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr b{font:600 19px/1 var(--f-num);font-variant-numeric:tabular-nums}
.sr.lose{color:var(--faint)}
.series small{font-size:11px;color:var(--muted)}
.series small.done{color:var(--brand-ink)}
.series small.on{color:var(--red)}
.series.big{padding:14px;gap:10px}
.series.big .sr{font-size:17px;gap:10px}
.series.big .sr b{font-size:32px}
.series.big small{font-size:13px}
.wsg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 14px}
.wsg button{padding:5px 10px;border-radius:8px;background:var(--soft);font:500 13px var(--f-body);color:var(--muted);display:inline-flex;gap:6px;align-items:baseline}
.wsg button b{font:600 15px var(--f-num);color:var(--fg)}
/* player page */
.phero{position:relative;overflow:hidden;color:var(--on-team);background:linear-gradient(160deg,var(--tc) 0%,var(--tc) 45%,var(--mast-2) 150%);
  padding:6px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.phero .seam{position:absolute;right:-20%;top:-20%;width:65%;aspect-ratio:1;opacity:.1}
.pshot{position:relative;flex:none;width:78px;height:78px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);font:900 28px var(--f-display)}
.pshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--soft)}
.phero-top{position:relative;display:flex;align-items:center;gap:14px}
.phero .sub{position:relative;font-size:13px;opacity:.85}
.pbar{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.18);border-radius:10px;padding:10px 4px}
.pbar div{display:grid;justify-items:center;gap:2px;font-size:11px;opacity:.9;text-align:center;padding:0 4px;min-width:0}
.pbar div+div{border-left:1px solid rgba(255,255,255,.18)}
.pbar b{font-size:15px;font-weight:500;opacity:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;font-size:12px;font-weight:700}
.form .w{color:#7ee2a4}.form .l{color:#ff9aa6}
.radar{display:block;width:100%;max-width:340px;margin:0 auto}
.overall{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:14px 14px 0;font:900 18px var(--f-display);color:var(--muted)}
.overall b{font:700 40px var(--f-num);color:var(--red)}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:6px 14px 14px;font-size:15px}
.traits span{display:flex;align-items:center;gap:8px}
.traits em{font-style:normal;font-size:11px;padding:2px 5px;border-radius:3px;color:var(--on-team);background:var(--red)}
.traits em.weak{background:var(--brand)}
.abars{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding:6px 14px 14px}
.abar{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px;min-width:0}
.abar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.abar b{font:600 15px var(--f-num)}
.abar i{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.abar i::before{content:"";display:block;height:100%;width:var(--w);background:var(--c)}
.sheet-h .pk-btn{width:auto;min-width:40px;height:28px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.18);color:inherit;font:700 13px var(--f-num);letter-spacing:.5px}
.pk-entry{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;font-size:14px;color:var(--muted)}
.pk-entry b{font:800 13px var(--f-num);color:#fff;background:linear-gradient(90deg,var(--brand),var(--red));padding:3px 8px;border-radius:4px}
.pk-entry span{flex:1;text-align:left;color:var(--fg)}
.pk-cur{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 16px 0;font-size:15px}
.pk-cur b{font:900 15px var(--f-display);color:var(--red)}
.pk-cur small{color:var(--faint);font-size:12px}
.pkhero{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:18px 12px 16px;background:var(--mast);color:var(--on-mast)}
.pkhero>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pkhero .pk-p{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%;color:inherit}
.pkhero .pshot{width:68px;height:68px;box-shadow:0 0 0 3px var(--pc)}

async function api(path,ms=8000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);

function stageText(x){
  const d=x.seriesDescription||'',n=x.seriesGameNumber,post=/[FDLW]/.test(x.gameType);

  return post&&n?`${s} 第${n}场`:s;
}
function mapGame(x){
  const ls=x.linescore||{},inn=ls.innings||[],st=x.status||{};
  const side=k=>({t:ID2AB[x.teams[k].team.id],ln:inn.map(i=>i[k]&&i[k].runs),r:x.teams[k].score,
    h:(ls.teams&&ls.teams[k]&&ls.teams[k].hits)||0,e:(ls.teams&&ls.teams[k]&&ls.teams[k].errors)||0,
    sp:x.teams[k].probablePitcher&&x.teams[k].probablePitcher.fullName,rec:x.teams[k].leagueRecord});
  const g={id:'m'+x.gamePk,pk:x.gamePk,real:1,day:dayOf(x.gameDate),lg:'MLB',stage:stageText(x),venue:x.venue&&x.venue.name,
    time:(d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`)(new Date(x.gameDate)),ts:Date.parse(x.gameDate),a:side('away'),h:side('home'),
    status:st.abstractGameState==='Live'?'live':st.abstractGameState==='Final'?'final':'pre',detail:st.detailedState};
  if(g.status==='live'){const o=ls.offense||{};
    g.live={inn:ls.currentInning||1,half:ls.isTopInning===false?'bot':'top',outs:ls.outs||0,b:ls.balls||0,s:ls.strikes||0,
      bases:[!!o.first,!!o.second,!!o.third],batterName:o.batter&&o.batter.fullName,batterId:o.batter&&o.batter.id};}

  Promise.all([loadTx().catch(()=>{Live.tx=[];}),loadScoring().catch(()=>{}),loadStandings().catch(()=>{}),loadLeaders().catch(()=>{}),loadPost().catch(()=>{Live.post=[];})]).then(()=>{openDeep(2);if(S.tab==='stats'||S.tab==='home')render();refreshSheet();});

}

/* ---------- live simulation (example mode only) ---------- */
function sim(){
  const g=SAMPLE_GAMES[0]; if(g.status!=='live')return;
  const L=g.live, bat=L.half==='top'?g.a:g.h, label=`${L.inn}局${L.half==='top'?'上':'下'}`;
  const r=Math.random(), order=`第${L.batter}棒`; let msg=null, scored=0;
  const next=()=>{L.batter=L.batter%9+1;L.b=0;L.s=0;};
  const adv=(n,walk)=>{let b=L.bases.slice(),rs=0;
    if(walk){if(b[0]&&b[1]&&b[2])rs++;if(b[0]&&b[1])b[2]=1;if(b[0])b[1]=1;b[0]=1;}
    else{for(let i=2;i>=0;i--)if(b[i]){b[i]=0;const to=i+n;if(to>=3)rs++;else b[to]=1;}if(n>=4)rs++;else b[n-1]=1;}
    L.bases=b;return rs;};
  if(r<.32){L.b++;if(L.b===4){scored=adv(1,1);msg=`${order} 四坏球保送`;next();}}
  else if(r<.62){L.s++;if(L.s===3){L.outs++;msg=`${order} 三振出局`;next();}}
  else if(r<.66){if(L.s<2)L.s++;}
  else if(r<.84){L.outs++;msg=`${order} ${['游击滚地球出局','中外野高飞球接杀','二垒滚地球出局','一垒方向平飞球接杀'][Math.floor(Math.random()*4)]}`;next();}
  else if(r<.94){scored=adv(1);bat.h++;msg=`${order} 一垒安打`;next();}
  else if(r<.985){scored=adv(2);bat.h++;msg=`${order} 二垒安打`;next();}
  else{scored=adv(4);bat.h++;msg=`${order} 全垒打`;next();}
  if(scored){bat.ln[bat.ln.length-1]+=scored;msg+=`，得${scored}分`;}
  if(msg)g.plays.unshift([label,msg,scored?1:0]);
  const end=m=>{g.status='final';g.plays.unshift(['终',m,1]);};
  if(L.half==='bot'&&L.inn>=9&&runs(g.h)>runs(g.a))return end('再见安打，比赛结束');
  if(L.outs>=3){
    if(L.half==='top'){if(L.inn>=9&&runs(g.h)>runs(g.a))return end('比赛结束');L.half='bot';g.h.ln.push(0);}
    else{if(L.inn>=9&&runs(g.h)!==runs(g.a))return end('比赛结束');L.half='top';L.inn++;g.a.ln.push(0);}
    L.outs=0;L.b=0;L.s=0;L.bases=[0,0,0];
    g.plays.unshift([`${L.inn}局${L.half==='top'?'上':'下'}`,'攻守交换']);
  }
}

/* ---------- 比赛集锦（MLB 官方视频） ---------- */
// 视频和截图都由 MLB 官方服务器提供，这里只引用播放
const I_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
async function loadContent(pk){
  if(Live.content[pk]!==undefined)return;
  Live.content[pk]=null;
  try{
    const d=await api(`/v1/game/${pk}/content`,12000);
    const items=(d.highlights&&d.highlights.highlights&&d.highlights.highlights.items)||[];
    Live.content[pk]=items.map(it=>{
      const kw=it.keywordsAll||[],has=v=>kw.some(k=>k.value===v);
      const cuts=(it.image&&it.image.cuts)||[],cut=cuts.slice().sort((a,b)=>a.width-b.width).find(c=>c.width>=640)||cuts[0];
      const mp4=(it.playbacks||[]).find(p=>p.name==='mp4Avc')||(it.playbacks||[]).find(p=>/\.mp4/.test(p.url||''));
      const hls=(it.playbacks||[]).find(p=>p.name==='hlsCloud')||(it.playbacks||[]).find(p=>/\.m3u8/.test(p.url||''));
      const pidk=kw.find(k=>k.type==='player_id');
      const lo=(it.playbacks||[]).find(p=>p.name==='highBit'); // 1600kbps，比默认 4000kbps 小一半多，动图和国内网络用它
      return {h:it.headline||'',dur:(it.duration||'').replace(/^00:/,''),img:cut&&cut.src,mp4:mp4&&mp4.url,lo:(lo||mp4||{}).url,hls:hls&&hls.url,date:it.date||'',
        fv:/^Field View|exclusive-angle/i.test(it.headline||'')||has('exclusive-angle'),
        kind:has('game-recap')||has('mlb_recap')?'recap':has('condensed-game')||has('condensed_game')?'condensed':'clip',
        pid:pidk&&+pidk.value,pn:pidk&&pidk.displayName};
    }).filter(x=>x.mp4&&x.img);
    const rank={recap:0,condensed:1,clip:2};
    Live.content[pk].sort((a,b)=>rank[a.kind]-rank[b.kind]||a.date.localeCompare(b.date));
  }catch(e){Live.content[pk]=[];}
}

  else q.tx.textContent=zhPlay(p.desc).text||p.desc;

  const m=h.match(/^(.+?)['’]s?\s+(.+)$/)||h.match(/^(.+?)\s+(?:crushes|belts|smacks|launches|lines|rips|drills|blasts|hits|clubs|mashes|smashes|cranks|swats|lifts|knocks|ropes|slugs|plates|drives in|records|makes|tosses|throws|fans|strikes out|robs)\s+(.+)$/i);

const RBI_CN={2:'两分',3:'三分',4:'满贯'};

const stageTopic=g=>['世界大赛','联盟冠军赛','分区系列赛','外卡系列赛'].find(k=>String(g.stage||'').includes(k))||'常规赛';
function recapOf(g){
  if(!g.real||g.status!=='final')return null;
  const plays=Live.scoring[g.pk];if(!plays||!plays.length)return null;
  const ra=runs(g.a),rh=runs(g.h);if(ra===rh)return null;
  const W=ra>rh?g.a:g.h,L=W===g.a?g.h:g.a,wTop=W===g.a,ws=Math.max(ra,rh),ls=Math.min(ra,rh);
  const Wn=team(W.t).n,Ln=team(L.t).n,nm=p=>p.n?dispName(p.n):'—';

  let prevA=0,prevH=0,ga=null;
  plays.forEach(p=>{const a=p.as!=null?p.as:prevA,h=p.hs!=null?p.hs:prevH;
    const wb=wTop?prevA:prevH,lb=wTop?prevH:prevA,wa=wTop?a:h,la=wTop?h:a;
    if(p.top===wTop&&wb<=lb&&wa>la)ga=p;prevA=a;prevH=h;});
  const mine=plays.filter(p=>p.top===wTop),hr=mine.filter(p=>p.ev==='Home Run').sort((x,y)=>(y.rbi||0)-(x.rbi||0))[0];
  const walkoff=ga&&!wTop&&ga===plays[plays.length-1]&&ga.inn>=9;
  const hero=ga||hr||mine.slice().sort((x,y)=>(y.rbi||0)-(x.rbi||0))[0];
  let title=`${Wn} ${ws}-${ls} ${Ln}`;
  if(walkoff)title+=`，${nm(ga)}${ga.inn}局下${evPhrase(ga)}再见`;
  else if(hero&&hero===ga)title+=`，${nm(ga)}${ga.inn}局${evPhrase(ga)}打下制胜分`;
  else if(hero)title+=`，${nm(hero)}${evPhrase(hero)}`;
  if(ls===0)title+=`${hero?'':'，'}完封`;
  const s=(Live.post||[]).find(x=>x.games.some(y=>y.id===g.id));
  const series=s?`系列赛方面，${seriesStatus(s).t}。`:'';
  const d=dateAt(g.day);

    `得分过程：${plays.map(p=>`${HALF(p)}，${team((p.top?g.a:g.h).t).n}的${nm(p)}${evPhrase(p)}${p.as!=null?`（${p.as}-${p.hs}）`:''}`).join('；')}。`];

    body,gref:g.id,auto:1,day:g.day,time2:g.time};
}

const TX_POS={RHP:'右投',LHP:'左投',P:'投手',C:'捕手','1B':'一垒手','2B':'二垒手','3B':'三垒手',SS:'游击手',LF:'左外野手',CF:'中外野手',RF:'右外野手',OF:'外野手',IF:'内野手',INF:'内野手',DH:'指定打击',UT:'工具人'};

const ROUNDS=[['W','世界大赛','七战四胜'],['L','联盟冠军赛','七战四胜'],['D','分区系列赛','五战三胜'],['F','外卡系列赛','三战两胜']];
const NEED={F:2,D:3,L:4,W:4};
async function loadPost(){
  const d=await api(`/v1/schedule/postseason?season=${SEASON}&sportId=1&hydrate=linescore`);
  const games=[];
  (d.dates||[]).forEach(day=>day.games.forEach(x=>{
    if(ID2AB[x.teams.away.team.id]&&ID2AB[x.teams.home.team.id]&&/^[FDLW]$/.test(x.gameType))
      games.push(Object.assign(mapGame(x),{gt:x.gameType,len:x.gamesInSeries}));}));
  Live.post=buildSeries(games);
}
function buildSeries(games){
  const map={};
  games.forEach(g=>{
    const pair=[g.a.t,g.h.t].sort(),k=g.gt+'-'+pair.join('-');
    const s=map[k]=map[k]||{k,gt:g.gt,teams:pair,wins:{[pair[0]]:0,[pair[1]]:0},games:[],len:0};
    s.games.push(g);s.len=Math.max(s.len,g.len||0);
    if(g.status==='final'){const ra=runs(g.a),rh=runs(g.h);if(ra!==rh)s.wins[ra>rh?g.a.t:g.h.t]++;}
  });
  return Object.values(map).map(s=>{
    s.need=s.len?Math.floor(s.len/2)+1:NEED[s.gt];
    s.winner=s.teams.find(t=>s.wins[t]>=s.need)||null;
    s.lg=s.gt==='W'?'':MLB[s.teams[0]].lg;
    s.games.sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));
    return s;
  });
}

  .map(([gt,w,l,ww,lw])=>({k:'s-'+gt+w,gt,teams:[w,l],wins:{[w]:ww,[l]:lw},winner:w,need:NEED[gt],lg:gt==='W'?'':MLB[w].lg,games:[],sample:1}));

function pzSentence(x){

// 返回 {text, all}：all 表示每一句都翻译了
function zhPlay(desc){
  let d=String(desc||'').trim(),pre='',all=true;
  // 挑战："Rays challenged (force play), call on the field was overturned: ..."
  let m;
  while((m=d.match(/^(.+?) challenged \((.+?)\), call on the field was (overturned|upheld|confirmed|stands):\s*/))){
    const nick=m[1].trim(),t=Object.values(MLB).find(x=>x.en.endsWith(' '+nick)||x.en===nick);
    pre+=`【${t?t.n:nick}挑战${PZ_CHAL[m[2]]||m[2]}，${m[3]==='overturned'?'原判被推翻':'维持原判'}】`;
    d=d.slice(m[0].length);
  }
  const parts=d.replace(/\.$/,'').split(/(?<!\b[A-Z])\.\s+(?=[A-Z])/).map(x=>x.trim().replace(/\.$/,'')).filter(Boolean);
  const out=parts.map(p=>{const z=pzSentence(p);if(!z)all=false;return z||p+'.';});
  const translated=out.some((x,i)=>x!==parts[i]+'.');
  return {text:pre+out.join('，').replace(/\.，/g,'. ')+(all?'。':''),all,any:translated||!!pre};
}

async function askClaude(prompt,onText){
  if(AI.sample){
    try{return (await AI.sample(prompt,{onText})).text;}
    catch(e){throw {code:e.code,message:e.message};}
  }
  if(!apiKey)throw {code:'no_ai'};
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2026-10-21',
      'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-5-5',max_tokens:8000,stream:true,fallbacks:'default',
      output_config:{effort:'medium'},messages:[{role:'user',content:prompt}]})});
  if(!res.ok){
    let m='';try{m=(await res.json()).error.message;}catch(_){}
    throw {code:res.status===401||res.status===403?'bad_key':res.status===429?'rate_limited':'error',message:m};
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='',stop=null;
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const ev=buf.slice(0,i);buf=buf.slice(i+2);
      const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      let j;try{j=JSON.parse(line.slice(5));}catch(_){continue;}
      if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta'){text+=j.delta.text;onText&&onText({text});}
      else if(j.type==='message_delta'&&j.delta&&j.delta.stop_reason)stop=j.delta.stop_reason;
      else if(j.type==='error')throw {code:'error',message:j.error&&j.error.message};
    }
  }
  if(stop==='refusal')throw {code:'refusal'};
  return text;
}

  arm_strength:'传球臂力',sprint_speed:'冲刺速度',oaa:'守备价值 OAA',bat_speed:'挥棒速度',squared_up_rate:'扎实击球率',xera:'预期防御率 xERA',fb_velocity:'直球球速',fb_spin:'直球转速',curve_spin:'曲球转速'};
const PCT_SHORT={xwoba:'xwOBA',xba:'预期打击率',xslg:'预期长打率',xiso:'纯长打',xobp:'预期上垒',brl_percent:'强击率',exit_velocity:'击球初速',max_ev:'最快初速',hard_hit_percent:'强击球率',
  k_percent:'三振率',bb_percent:'保送率',whiff_percent:'挥空率',chase_percent:'追打坏球',arm_strength:'臂力',sprint_speed:'冲刺速度',oaa:'守备价值',bat_speed:'挥棒速度',squared_up_rate:'扎实击球',
  xera:'预期防御率',fb_velocity:'直球球速',fb_spin:'直球转速',curve_spin:'曲球转速'};
const avgOf=(a,...k)=>{const v=k.map(x=>a[x]).filter(x=>typeof x==='number');return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null;};
function pctAxes(a,pitcher){
  return (pitcher?[['压制',avgOf(a,'xera','xwoba')],['三振',avgOf(a,'k_percent','whiff_percent')],['控球',a.bb_percent],['球速',a.fb_velocity],['诱打',a.chase_percent],['防强击',avgOf(a,'hard_hit_percent','brl_percent','exit_velocity')]]
    :[['打击',avgOf(a,'xba','squared_up_rate')],['力量',avgOf(a,'xslg','brl_percent','max_ev')],['击球强度',avgOf(a,'exit_velocity','hard_hit_percent','bat_speed')],['选球',avgOf(a,'bb_percent','chase_percent','k_percent','whiff_percent')],['速度',a.sprint_speed],['守备',avgOf(a,'oaa','arm_strength')]]).filter(x=>x[1]!=null);
}
const PCT_ORDER_B=['xwoba','xba','xslg','xiso','xobp','brl_percent','exit_velocity','max_ev','hard_hit_percent','bat_speed','squared_up_rate','k_percent','bb_percent','whiff_percent','chase_percent','sprint_speed','oaa','arm_strength'];
const PCT_ORDER_P=['xera','xwoba','xba','xslg','fb_velocity','fb_spin','curve_spin','k_percent','bb_percent','whiff_percent','chase_percent','brl_percent','hard_hit_percent','exit_velocity','arm_strength'];
// Savant's own palette: blue for low percentiles, red for high
const pctColor=v=>v>=90?'#d22d49':v>=70?'#e8776f':v>=40?'#9aa3b5':v>=20?'#7b9ad6':'#3a65c4';
const coreOf=(a,pitcher)=>pitcher?(a.xera!=null?['xera','预期防御率 xERA']:['xwoba','被打 xwOBA']):['xwoba','xwOBA'];
// 综合能力：核心指标的联盟百分位换算到 40–99
function overallOf(a,pitcher){
  const c=a[coreOf(a,pitcher)[0]];if(c!=null)return Math.round(40+c*0.59);
  const v=Object.values(a);return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null;
}
function ratingHTML(a,pitcher){
  const axes=pctAxes(a,pitcher),keys=(pitcher?PCT_ORDER_P:PCT_ORDER_B).filter(k=>a[k]!=null);
  if(keys.length<3)return `<section class="panel"><div class="empty">${pitcher?'投球':'打击'}样本不足，Statcast 没有给出排名</div></section>`;
  const core=coreOf(a,pitcher),overall=overallOf(a,pitcher);
  const sorted=keys.slice().sort((x,y)=>a[y]-a[x]),strong=sorted.filter(k=>a[k]>=90).slice(0,4),weak=sorted.filter(k=>a[k]<=15).slice(-3);
  return `<section class="panel"><div class="overall">${pitcher?'投球':'打击'}${term('综合')}<b>${overall}</b></div>${axes.length>=3?radarSVG(axes):''}
    ${strong.length||weak.length?`<div class="traits">${strong.map(k=>`<span><em>强项</em>${PCT_SHORT[k]}</span>`).join('')}${weak.map(k=>`<span><em class="weak">弱项</em>${PCT_SHORT[k]}</span>`).join('')}</div>`:''}</section>
    <section class="panel"><div class="sec-h">Statcast 百分位<small>${RT.data.year} 赛季</small></div><div class="abars" style="grid-template-columns:1fr">${keys.map(k=>
      `<div class="abar"><span>${term(PCT_CN[k],k)}</span><b style="color:${pctColor(a[k])}">${a[k]}</b><i style="--w:${a[k]}%;--c:${pctColor(a[k])}"></i></div>`).join('')}</div>
    <div class="note">数据来源：Baseball Savant（MLB 官方 Statcast）· 更新于 ${esc(RT.data.updated)}。数字是联盟百分位：90 表示比 90% 的${pitcher?'投手':'打者'}好，越红越好、越蓝越差。综合能力取 ${core[1]}（Statcast 衡量${pitcher?'投手压制力':'打者整体进攻'}的核心指标）的联盟百分位，换算到 40–99 分：联盟中游约 70，顶尖 95 以上。</div></section>`;
}
// vs: optional second player's values, same order as axes (球员 PK)
function radarSVG(axes,vs){
  const cx=170,cy=150,R=92,N=axes.length,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const rv=v=>R*(.12+.88*Math.max(0,Math.min(100,v))/100);
  const ring=f=>axes.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const series=(vals,c,op)=>`<polygon points="${vals.map((v,i)=>pt(i,rv(v)).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width="2"/>${vals.map((v,i)=>{const [x,y]=pt(i,rv(v));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${c}"/>`;}).join('')}`;
  const lab=axes.map(([k,v],i)=>{const [x,y]=pt(i,R+30),anchor=Math.abs(x-cx)<5?'middle':x>cx?'start':'end';
    const val=vs?`<tspan fill="var(--brand)">${v}</tspan><tspan fill="var(--faint)" font-weight="400"> : </tspan><tspan fill="var(--red)">${vs[i]}</tspan>`
      :`<tspan fill="${v>=85?'var(--red)':v>=70?'var(--gold)':'var(--muted)'}">${v}</tspan>`;
    return `<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="${anchor}" font-size="13" fill="var(--muted)">${k}</text><text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${anchor}" font-size="15" font-weight="700">${val}</text>`;}).join('');
  return `<svg class="radar" viewBox="${vs?'-30 0 400 300':'0 0 340 300'}" role="img" aria-label="能力雷达图">${[1,.75,.5,.25].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${axes.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;}).join('')}
    ${series(axes.map(a=>a[1]),'var(--brand)',vs?.18:.28)}${vs?series(vs,'var(--red)',.18):''}${lab}</svg>`;
}
const TX_CN={TR:'交易',SFA:'自由球员签约',CLW:'被认领',SGN:'签约',DR:'选秀'};

function txHTML(L){

function spansHTML(L,gp){
  const out=[];
  ((L.years&&L.years[gp])||[]).forEach(y=>{if(!y.team)return;const last=out[out.length-1];
    if(last&&last.id===y.team.id&&+y.season-+last.to<=1){last.to=y.season;last.rows.push(y.stat);}
    else out.push({id:y.team.id,name:y.team.name,from:y.season,to:y.season,rows:[y.stat]});});
  if(!out.length)return '';
  const cols=gp==='pitching'?[['gamesPlayed','出赛'],['wins','胜'],['strikeOuts','三振']]:[['gamesPlayed','出赛'],['homeRuns','全垒打'],['rbi','打点']];

  return `<section class="panel"><div class="sec-h">球队生涯</div><div class="span-h">${cols.map(c=>`<span>${c[1]}</span>`).join('')}</div>${out.reverse().map(sp=>{const ab2=ID2AB[sp.id];
    return `<div class="span-row${ab2?' tl':''}" ${ab2?`data-teamp="${ab2}" role="link" tabindex="0"`:''}>${ab2?logo(ab2,'md'):'<span class="logo md" style="--tc:var(--faint)">—</span>'}<div><span>${esc(ab2?team(ab2).n:sp.name)}</span><small>${sp.from===sp.to?sp.from:sp.from+' – '+(sp.to==SEASON?'至今':sp.to)}</small></div>${cols.map(c=>`<b style="width:54px">${sumc(sp.rows,c[0])}</b>`).join('')}</div>`;}).join('')}</section>`;

function yearsHTML(L,gp){

const PK={state:'idle',byId:{}}; // 本赛季全部大联盟球员，用于挑选对比对象
async function loadPool(){
  if(PK.state!=='idle')return;PK.state='loading';
  try{
    const d=await api(`/v1/sports/1/players?season=${SEASON}&fields=people,id,fullName,currentTeam,id,primaryPosition,abbreviation`,15000);
    (d.people||[]).forEach(p=>PK.byId[p.id]={id:p.id,n:p.fullName,t:p.currentTeam&&ID2AB[p.currentTeam.id],pos:p.primaryPosition&&p.primaryPosition.abbreviation});

  }catch(e){PK.state='err';}
}
const pkInfo=id=>{const L=Live.player[id],p=L&&L.p,x=PK.byId[id]||{},h=PH[id]||{};
  return {id,n:p?p.fullName:x.n||h.n||'',t:(p&&p.currentTeam&&ID2AB[p.currentTeam.id])||x.t||h.t,pos:(p&&p.primaryPosition&&p.primaryPosition.abbreviation)||x.pos};};
const pkGroups=L=>L.p&&L.p.primaryPosition&&L.p.primaryPosition.abbreviation==='TWP'?['hitting','pitching']:[L.grp];
function pkRow(a,x){
  const zh=zhName(x.n);
  return `<button class="lrow" data-pkwith="${a}-${x.id}">${x.t?logo(x.t):'<span class="logo" style="--tc:var(--faint)">—</span>'}<span>${esc(zh||x.n)}${zh?` <small style="color:var(--faint)">${esc(x.n)}</small>`:''}</span><small style="color:var(--muted)">${esc(x.pos?POS_CN[x.pos]||x.pos:'')}</small></button>`;
}
function pkResults(a,q){
  const A=Live.player[a],kw=q.trim(),lo=kw.toLowerCase();
  const pit=A?pkGroups(A).length>1?null:A.grp==='pitching':null; // null：二刀流，投打都能比
  const isP=x=>x.pos==='P'||x.pos==='SP'||x.pos==='RP';
  const pool={};Object.entries(PH).forEach(([id,h])=>{if(!h.job&&h.n)pool[id]=pkInfo(+id);});Object.keys(PK.byId).forEach(id=>pool[id]=pkInfo(+id));
  delete pool[a];
  if(kw){
    const hits=Object.values(pool).filter(x=>x.n.toLowerCase().includes(lo)||normName(x.n).includes(normName(kw))||zhName(x.n).includes(kw))
      .sort((x,y)=>(pit==null?0:(isP(x)!==pit)-(isP(y)!==pit))).slice(0,30);
    return hits.length?`<section class="panel">${hits.map(x=>pkRow(a,x)).join('')}</section>`
      :`<div class="empty">${PK.state==='loading'?'正在读取球员名单…':`没有找到“${esc(kw)}”`}</div>`;
  }
  let r='';
  if(RT.state==='ok'){
    const src=pit?RT.data.pitchers:RT.data.batters;
    const top=Object.entries(src).filter(([id])=>pool[id]).map(([id,v])=>[pool[id],overallOf(v,!!pit)]).sort((x,y)=>y[1]-x[1]).slice(0,15);
    if(top.length)r+=`<section class="panel"><div class="sec-h">综合能力最高的${pit?'投手':'打者'}<small>Baseball Savant ${RT.data.year}</small></div>${top.map(([x])=>pkRow(a,x)).join('')}</section>`;
  }
  const ab=pkInfo(a).t,mates=Object.values(pool).filter(x=>x.t&&x.t===ab&&(pit==null||isP(x)===pit)).slice(0,20);
  if(mates.length)r+=`<section class="panel"><div class="sec-h">${esc(team(ab).n)}队友</div>${mates.map(x=>pkRow(a,x)).join('')}</section>`;
  return r||`<div class="empty">${PK.state==='loading'?'正在读取球员名单…':'输入名字搜索要对比的球员'}</div>`;
}
function pickerHTML(a){

    <div class="pk-cur">${esc(zhName(x.n)||x.n||'球员')} <b>VS</b> ？<small>选一位球员进行 PK</small></div><div class="wrap" id="pk-res">${pkResults(a,'')}</div>`;

const LOWER_BETTER=new Set(['era','whip','losses']);
function pkStatRows(sa,sb,defs){
  return defs.map(([k,label])=>{
    const va=sa&&sa[k],vb=sb&&sb[k];if(va==null&&vb==null)return '';
    const a=parseFloat(va)||0,b=parseFloat(vb)||0,tot=a+b||1,low=LOWER_BETTER.has(k);
    const wa=va!=null&&(vb==null||(low?a<=b:a>=b)),wb=vb!=null&&(va==null||(low?b<=a:b>=a));
    return `<div class="cmp pk"><b class="${wa?'wa':''}">${esc(va!=null?va:'—')}</b><div class="bar l"><i style="--w:${a/tot*100}%;--c:${wa?'var(--brand)':'var(--faint)'}"></i></div><span>${term(label)}${low?'<small>越低越好</small>':''}</span><div class="bar"><i style="--w:${b/tot*100}%;--c:${wb?'var(--red)':'var(--faint)'}"></i></div><b class="${wb?'wb':''}">${esc(vb!=null?vb:'—')}</b></div>`;}).join('');
}
function sheetPK(key,gp){

  else{

    if(ra&&rb){
      const xa=pctAxes(ra,pit),xb=Object.fromEntries(pctAxes(rb,pit)),axes=xa.filter(([k])=>xb[k]!=null);
      const keys=(pit?PCT_ORDER_P:PCT_ORDER_B).filter(k=>ra[k]!=null&&rb[k]!=null);

        <div class="pk-legend"><span><i style="background:var(--brand)"></i>${esc(dispName(pkInfo(a).n))}</span><span><i style="background:var(--red)"></i>${esc(dispName(pkInfo(b).n))}</span></div></section>
        <section class="panel"><div class="sec-h">Statcast 百分位<small>${RT.data.year} 赛季</small></div>${keys.map(k=>
          `<div class="cmp pk"><b class="${ra[k]>=rb[k]?'wa':''}">${ra[k]}</b><div class="bar l"><i style="--w:${ra[k]}%;--c:${ra[k]>=rb[k]?'var(--brand)':'var(--faint)'}"></i></div><span>${term(PCT_SHORT[k],k)}</span><div class="bar"><i style="--w:${rb[k]}%;--c:${rb[k]>=ra[k]?'var(--red)':'var(--faint)'}"></i></div><b class="${rb[k]>=ra[k]?'wb':''}">${rb[k]}</b></div>`).join('')}

  return h+'</div>';

function showInfo(title,text){
  let el=$('#gloss');
  if(!el){el=document.createElement('div');el.id='gloss';el.className='gloss';document.body.appendChild(el);}
  el.innerHTML=`<div class="gloss-c" role="dialog" aria-label="${esc(title)}"><b>${esc(title)}</b><p>${esc(text)}</p><button data-act="gclose">知道了</button></div>`;el.hidden=false;
}

/* ---------- 收藏（只保存在本机） ---------- */
let favs=store.get('favs',[]);
const isFav=id=>favs.some(f=>f.id===id);
function toggleFav(id){
  if(isFav(id)){favs=favs.filter(f=>f.id!==id);toast('已取消收藏');}
  else{const n=allNews().find(x=>x.id===id);if(!n)return;favs.unshift({id,title:n.title,src:n.src,date:ymd(new Date())});toast('已收藏，在「我的」里可以找到');}
  store.set('favs',favs);refreshSheet();if(S.tab==='me')render();
}

/* ---------- 添加到手机桌面 ---------- */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
function installGuide(){
  if(installEvt){installEvt.prompt();installEvt=null;return;}
  const ua=navigator.userAgent;
  showInfo('添加到手机桌面',/MicroMessenger/i.test(ua)?'微信里不能直接添加。先点右上角「…」，选「在浏览器打开」，然后在浏览器里添加到主屏幕。添加后点桌面图标打开，就像一个独立的 App，没有地址栏。'
    :/iPhone|iPad|iPod/i.test(ua)?'用 Safari 打开本页，点屏幕底部中间的「分享」按钮（方框加向上箭头），向下滑，选「添加到主屏幕」，再点「添加」。之后从桌面图标打开，就像一个独立的 App。'
    :'点浏览器右上角「⋮」或底部菜单，选「添加到主屏幕」或「安装应用」。之后从桌面图标打开，就像一个独立的 App。');
}

/* ---------- 搜索球员 ---------- */
function findPlayers(kw,limit){
  const lo=normName(kw),pool={};
  Object.entries(PH).forEach(([id,h])=>{if(h.n)pool[id]=pkInfo(+id);});Object.keys(PK.byId).forEach(id=>pool[id]=pkInfo(+id));
  return Object.values(pool).filter(x=>x.n&&(normName(x.n).includes(lo)||zhName(x.n).includes(kw))).slice(0,limit);
}

/* ---------- 下拉刷新；离开一段时间后回来自动更新 ---------- */
let refreshing=false,lastRefresh=Date.now();
async function refreshAll(quiet){
  if(refreshing)return;
  if(ymd(new Date())!==ymd(TODAY)){location.reload();return;} // 跨天了，日期全部要重算
  if(Live.state!=='ok'){if(!quiet)toast('当前无法连接 MLB 官方数据');return;}
  refreshing=true;
  try{await loadSchedule();}catch(e){refreshing=false;if(!quiet)toast('刷新失败，请检查网络');return;}
  await Promise.all([loadTx().catch(()=>{}),loadScoring().catch(()=>{}),loadStandings().catch(()=>{}),loadLeaders().catch(()=>{}),loadPost().catch(()=>{})]);
  if(myTeam)delete Live.teamSched[myTeam];
  Live.fa=undefined;
  refreshing=false;lastRefresh=Date.now();render();refreshSheet();if(!quiet)toast('已更新到最新');
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRefresh>3*60e3)refreshAll(true);});
(()=>{
  let y0=null,dy=0;const ind=document.createElement('div');ind.className='ptr';document.body.appendChild(ind);
  const show=t=>{ind.textContent=t;ind.style.opacity=t?1:0;ind.style.transform=`translate(-50%,${Math.min(dy,90)/2}px)`;};
  addEventListener('touchstart',e=>{y0=!S.sheet&&scrollY<=0&&e.touches.length===1?e.touches[0].clientY:null;dy=0;},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>10&&scrollY<=0)show(dy>70?'松开刷新':'下拉刷新');else show('');},{passive:true});
  addEventListener('touchend',async()=>{if(y0==null)return;y0=null;if(dy>70){show('正在刷新…');await refreshAll();}dy=0;show('');});
})();

/* ---------- 比赛提醒：开赛前 10 分钟、比分变化、比赛结束 ---------- */
// 没有推送服务器，所以本垒要开着（可以在后台）才能提醒；iPhone 需要先添加到桌面才能弹系统通知
let reminders=store.get('remind',[]);
const notifyMy=()=>store.get('notifymy',true);
const remindBtn=g=>`<button class="bell" data-remind="${g.pk}" aria-pressed="${reminders.includes(g.pk)}">${reminders.includes(g.pk)?'已设提醒':'开赛提醒'}</button>`;
let swReg=null;
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});}catch(e){}
async function askNotify(){try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();}catch(e){}}
function toggleRemind(pk){
  pk=+pk;const on=reminders.includes(pk);reminders=on?reminders.filter(x=>x!==pk):[...reminders,pk];store.set('remind',reminders);
  if(on)toast('已取消提醒');else{askNotify();toast('开赛前 10 分钟、比分变化和比赛结束时会提醒你（本垒需要开着，在后台也可以）',4000);}
  render();refreshSheet();checkGames();
}
function notify(title,body,hash){
  toast(`${title}：${body}`,5000);
  if(!document.hidden)return;
  try{if('Notification' in window&&Notification.permission==='granted'){
    const opt={body,icon:'icons/icon-192.png',tag:hash,data:{url:location.href.split('#')[0]+hash}};
    if(swReg)swReg.showNotification(title,opt);else new Notification(title,opt);}}catch(e){}
}
const notified=new Set(),lastSc={},lastSt={};
const watched=g=>g.real&&(reminders.includes(g.pk)||(notifyMy()&&myTeam&&(g.a.t===myTeam||g.h.t===myTeam)));
function checkGames(){
  (Live.games||[]).forEach(g=>{
    if(!watched(g))return;const nm=`${team(g.a.t).n} vs ${team(g.h.t).n}`,sc=`${team(g.a.t).n} ${runs(g.a)} - ${runs(g.h)} ${team(g.h.t).n}`,href='#g/'+g.id;
    if(g.status==='pre'&&g.ts&&g.ts-Date.now()<10*60e3&&g.ts-Date.now()>-30*60e3&&!notified.has('s'+g.pk)){notified.add('s'+g.pk);notify('比赛即将开始',`${nm} · ${g.time} 开打`,href);}
    if(g.status!=='pre'){
      const k=`${runs(g.a)}-${runs(g.h)}`;
      if(lastSt[g.pk]==='live'&&g.status==='final')notify('比赛结束',sc,href);
      else if(g.status==='live'&&lastSc[g.pk]!==undefined&&lastSc[g.pk]!==k)notify('比分更新',`${sc} · ${g.live?`${g.live.inn}局${g.live.half==='top'?'上':'下'}`:''}`,href);
      lastSc[g.pk]=k;
    }
    lastSt[g.pk]=g.status;
  });
}
setInterval(checkGames,30000);

/* ---------- 首页轮播：滑动时更新圆点，5 秒自动翻页（手指碰过后暂停一会儿） ---------- */
let carTouch=0;
document.addEventListener('scroll',e=>{const c=e.target;if(!c.classList||!c.classList.contains('carousel'))return;
  const i=Math.round(c.scrollLeft/c.clientWidth),d=c.nextElementSibling;if(d)d.querySelectorAll('i').forEach((x,k)=>x.classList.toggle('on',k===i));},true);
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('.carousel'))carTouch=Date.now();},{passive:true});
setInterval(()=>{const c=document.querySelector('#main .carousel');if(!c||S.sheet||document.hidden||Date.now()-carTouch<8000)return;
  const n=c.children.length,i=Math.round(c.scrollLeft/c.clientWidth);c.scrollTo({left:((i+1)%n)*c.clientWidth,behavior:'smooth'});},5000);

/* ---------- 返回键与分享链接：每打开一层页面就记一条浏览记录 ---------- */
// 手机侧滑 / 返回键会先关掉当前页面，而不是离开网站；地址栏里的 #p/660271 这类链接可以直接分享
let hDepth=0,skipPop=false;
const vOpen=()=>!!document.getElementById('vbox');
const navDepth=()=>(S.sheet?SHEET_STACK.length+1:0)+(vOpen()?1:0);
const ROUTE={player:'p',team:'t',game:'g',news:'n',pk:'pk',series:'s',topic:'tp'},ROUTE_KIND={p:'player',t:'team',g:'game',n:'news',pk:'pk',s:'series',tp:'topic'};
const navHash=()=>S.sheet&&ROUTE[S.sheet.kind]?`#${ROUTE[S.sheet.kind]}/${encodeURIComponent(S.sheet.id)}`:'#'+S.tab;
function syncHist(){
  const d=navDepth();
  try{
    if(d>hDepth){for(;hDepth<d;hDepth++)history.pushState({d:hDepth+1},'',navHash());}
    else if(d<hDepth){skipPop=true;history.go(d-hDepth);hDepth=d;}
    else history.replaceState(d?{d}:null,'',navHash());
  }catch(e){}
}
addEventListener('popstate',e=>{
  if(skipPop){skipPop=false;try{history.replaceState(hDepth?{d:hDepth}:null,'',navHash());}catch(_){}return;}
  const want=(e.state&&e.state.d)||0;
  while(navDepth()>want){if(vOpen())closeVideo();else closeSheet();}
  hDepth=navDepth();
  if(hDepth<want){skipPop=true;history.go(hDepth-want);} // “前进”无法重开已关的页面
  else try{history.replaceState(hDepth?{d:hDepth}:null,'',navHash());}catch(_){}
});
let deepLink=(location.hash.match(/^#(p|t|g|n|pk|s|tp)\/(.+)$/)||[]).slice(1);
// 1：连上数据后打开球员、球队、PK、比赛；2：战报、系列赛要等全部数据读完
function openDeep(stage){
  if(!deepLink.length)return;
  const [k,raw]=deepLink,need={p:1,t:1,pk:1,g:1,n:2,s:2,tp:2}[k];if(need!==stage)return;
  deepLink=[];const kind=ROUTE_KIND[k];let id=decodeURIComponent(raw);
  if(kind==='player')id=+id;if(kind==='team'&&!MLB[id])return;
  openSheet(kind,id);syncHist();
}
async function shareCurrent(){
  const url=location.href.split('#')[0]+navHash(),h=document.querySelector('#sheet-root .sheet-h b'),title=(h?h.textContent+' · ':'')+'本垒棒球';
  if(navigator.share){try{await navigator.share({title,url});}catch(e){}return;}
  try{await navigator.clipboard.writeText(url);toast('链接已复制，粘贴给朋友就能直接打开这一页');}
  catch(e){window.prompt('复制这个链接分享给朋友：',url);}
}
let toastT;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2400);}

document.addEventListener('click',e=>{
  const gl=$('#gloss');if(gl&&!gl.hidden&&!e.target.closest('.gloss-c')){gl.hidden=true;if(!e.target.closest('[data-term]'))return;}
  const b=e.target.closest('[data-term],[data-topic],[data-teamp],[data-player],button');if(!b)return;
  onClick(b);syncHist();
});
function onClick(b){
  const d=b.dataset;
  if(d.term)showTerm(d.term);
  else if(d.act==='gclose')$('#gloss').hidden=true;
  else if(d.act==='share')shareCurrent();
  else if(d.act==='install')installGuide();
  else if(d.fav)toggleFav(d.fav);
  else if(d.topic)openSheet('topic',d.topic);
  else if(d.remind)toggleRemind(d.remind);
  else if(d.sim)simCtl(d.sim);
  else if(d.siminn)simCtl('inn:'+d.siminn);
  else if(d.notifymy){store.set('notifymy',d.notifymy==='1');if(d.notifymy==='1')askNotify();render();}
  else if(d.gifset){store.set('gif',d.gifset==='1');render();toast(d.gifset==='1'?'动图会在滑到时自动播放':'已关闭自动播放，点一下才播放');}
  else if(d.tab){S.tab=d.tab;closeSheet(true);render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+d.tab)}catch(_){}}
  else if(d.ch){S.tab='home';S.ch=d.ch;closeSheet(true);render();window.scrollTo(0,0);}
  else if(d.txall){S.txAll=d.txall==='1';render();}
  else if(d.txfa){S.txFA=d.txfa==='1';render();}
  else if(d.faopen){S.faOpen=d.faopen==='1';S.faN=40;render();}
  else if(d.faall){S.faAll=d.faall==='1';S.faN=40;render();}
  else if(d.famine){S.faMine=d.famine==='1';S.faN=40;render();}
  else if(d.famore){S.faN=(S.faN||40)+40;render();}
  else if(d.lg){S.lg=d.lg;render();}
  else if(d.day!==undefined){S.day=+d.day;render();}
  else if(d.slg){S.slg=d.slg;render();}
  else if(d.sview){S.sview=d.sview;render();}
  else if(d.teamp){if(S.sheet&&S.sheet.kind==='team'){S.sheet.id=d.teamp;setTeamTab('feed');$('#sheet-root .sheet').scrollTop=0;}else openSheet('team',d.teamp);}
  else if(d.ttab)setTeamTab(d.ttab);
  else if(d.clip){const [pk,i]=d.clip.split(':');openVideo(+pk,+i);}
  else if(d.act==='vclose')closeVideo();
  else if(d.ptab){S.sheet.tab=d.ptab;refreshSheet();}
  else if(d.gtab){S.sheet.tab=d.gtab;refreshSheet();}
  else if(d.gside){S.sheet.side=d.gside;refreshSheet();}
  else if(d.player)openSheet('player',+d.player);
  else if(d.pk)openSheet('pkpick',+d.pk);
  else if(d.pkwith){ // 选好对手：替换掉挑选页（和旧的 PK 页），返回时回到球员主页
    const prev=SHEET_STACK.pop();S.sheet=prev&&prev.kind!=='pk'?prev:null;
    const x=pkInfo(+d.pkwith.split('-')[1]);hint(x.id,x.n,x.t);openSheet('pk',d.pkwith);$('#sheet-root .sheet').scrollTop=0;}
  else if(d.pkg){S.sheet.tab=d.pkg;refreshSheet();}
  else if(d.series)openSheet('series',d.series);
  else if(d.act==='bracket'){S.tab='stats';S.slg='MLB';S.sview='post';render();window.scrollTo(0,0);}
  else if(d.ai==='recap')runRecap(d.g);
  else if(d.ai==='translate')runTranslate(d.g);
  else if(d.act==='name-reset'){const f=b.closest('[data-name]');delete customNames[normName(f.dataset.name)];store.set('names',customNames);toast('已恢复默认译名');refreshSheet();}
  else if(d.act==='key-clear'){apiKey='';store.set('apikey','');toast('已清除 API Key');render();}
  else if(d.news)openSheet('news',d.news);
  else if(d.game)openSheet('game',d.game);
  else if(d.act==='search')openSheet('search');
  else if(d.act==='close')closeSheet();
  else if(d.act==='src')toast(Live.state==='ok'?'美职棒比分、积分榜、球员与教练来自 MLB 官方实时数据':Live.state==='loading'?'正在连接 MLB 官方数据…':'无法连接 MLB 官方数据，美职棒部分显示示例数据');
  else if(d.like){liked.has(d.like)?liked.delete(d.like):liked.add(d.like);store.set('liked',[...liked]);render();}
  else if(d.follow){
    const t=d.follow,on=follows.includes(t);
    follows=on?follows.filter(x=>x!==t):[...follows,t];store.set('follows',follows);
    toast(on?`已取消关注${team(t).n}`:`已关注${team(t).n}`);render();refreshSheet();
  }
  else if(d.myteam){
    const t=d.myteam,off=myTeam===t;myTeam=off?'':t;store.set('myteam',myTeam);
    if(!off&&!follows.includes(t)){follows=[...follows,t];store.set('follows',follows);}
    toast(off?`已取消主队${team(t).n}`:`${team(t).n}已设为主队，会显示在头条顶部`);render();refreshSheet();
  }
  else if(d.themeSet){theme=d.themeSet;store.set('theme',theme);applyTheme();render();}
}
document.addEventListener('input',e=>{if(e.target.id==='search-in')$('#search-res').innerHTML=sheetSearch(e.target.value);
  else if(e.target.id==='pk-in')$('#pk-res').innerHTML=pkResults(S.sheet.id,e.target.value);});
document.addEventListener('submit',e=>{
  const nf=e.target.closest('[data-name]');
  if(nf){e.preventDefault();const v=$('#zh-in').value.trim(),k=normName(nf.dataset.name);
    if(v)customNames[k]=v;else delete customNames[k];store.set('names',customNames);toast(v?`译名已保存：${v}`:'已清除译名');refreshSheet();return;}
  const kf=e.target.closest('[data-keyform]');
  if(kf){e.preventDefault();const v=$('#key-in').value.trim();if(!v)return;apiKey=v;store.set('apikey',v);toast('API Key 已保存在本机');render();return;}
  const f=e.target.closest('[data-comment]');if(!f)return;e.preventDefault();
  const v=$('#cmt-in').value.trim();if(!v)return;
  (myComments[f.dataset.comment]=myComments[f.dataset.comment]||[]).unshift(['棒球新手',v,'刚刚',0]);
  store.set('comments',myComments);toast('评论已发布（只保存在这台设备上）');refreshSheet();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#gloss')&&!$('#gloss').hidden)$('#gloss').hidden=true;
  else if(e.key==='Escape'&&document.getElementById('vbox')){closeVideo();syncHist();}
  else if(e.key==='Escape'&&S.sheet){closeSheet();syncHist();}
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="link"]')){e.preventDefault();e.target.click();}
});

setInterval(()=>{
  if(Live.state==='ok')return;
  const g=SAMPLE_GAMES[0];if(g.status!=='live')return;
  sim();
  document.querySelectorAll('[data-gcard="g1"]').forEach(el=>el.outerHTML=gameCard(g));
  document.querySelectorAll('[data-gmini="g1"]').forEach(el=>el.outerHTML=miniCard(g));
  if(S.sheet&&S.sheet.id==='g1')refreshSheet();
},3500);

const h=(location.hash||'').slice(1);if(VIEWS[h])S.tab=h;
render();
boot();
})();
